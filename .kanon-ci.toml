# archetype:
# forge-only: false
# spdx: LicenseRef-PolyForm-Shield-1.0.0

# Forge CI pipeline for forkwright/thumos.
#
# Extends the hardcoded default Rust gate (fmt → check → clippy → nextest
# → lint) with the excluded kernel crate's full evidence chain (#546): ARM
# cross-compile, trust-anchor build guard (#233), i686 host tests, and the
# QEMU witness matrix — all as canonical scripts under scripts/ shared with
# .github/workflows/ci.yml, never inline re-implementations. Per-stage build
# + test concurrency stays pinned to 8. Without this cap, cargo
# defaults to num_cpus (64 on this Threadripper) and parallel rustc +
# nextest processes peak well over 100GB of RSS — enough to OOM menos
# when any other fleet work is running. 8 is the budget that keeps a single
# CI run under ~25GB peak, low enough that serial drains don't OOM even
# with aletheia.service and the dispatch fleet resident.
#
# Keep the default stages in sync with
# `crates/archeion/src/ci_config.rs::default_rust_gate` when the upstream
# default changes. Thumos-specific differences should remain limited to the
# kernel stages (which call the canonical scripts) and resource-budget flags.

[pipeline]
stages = [
    "cargo fmt",
    "cargo check",
    # WHY before "kernel build": a source-level grep that names the CAUSE of the
    # link failure the next stage would otherwise report as undefined symbols.
    "kernel build entrypoint",
    "kernel build",
    "kernel trust anchor",
    "kernel host tests",
    "crypto zeroize features",
    "board seam",
    "convergence",
    "kernel qemu witnesses",
    "wiring inventory",
    "doc inventory",
    "pin parity",
    "llm issue refs",
    "kernel lockfile versions",
    "fuzz lockfile versions",
    "fuzz target coverage",
    "target test ledger",
    "cargo clippy",
    "cargo nextest",
    "kanon lint",
    # WHY LAST (#663/#672): a failing stage aborts the pipeline, and this one
    # is known-red while #672's backlog is open. Ordered ahead of the other
    # kernel stages it would stop them running, trading working gates for a
    # new one.
    "kernel clippy",
]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

# WHY --locked (#757): without it, a dependency-resolving stage silently
# regenerates Cargo.lock when a manifest and the committed lock disagree --
# the drift never fails, and whatever it pulled in is never scanned by
# cargo-audit/cargo-deny. --locked (not --frozen, which also forbids network)
# turns that drift into a stage failure instead.
[stages."cargo check"]
cmd = "cargo check --workspace --all-targets --locked --jobs 8"
timeout_secs = 900

# WHY (#546): env RUSTFLAGS REPLACES the rustflags in crates/thumos/.cargo/
# config.toml rather than merging, so a kernel build that inherits the variable
# loses the link script AND the -D warnings gate (#431). kernel-build.sh strips
# it; this stage keeps that from being the only guarded site, because one
# stripped invocation beside an unstripped one is a coincidence, not a guard.
# Only the link loss is loud — a dropped warning gate ships green.
[stages."kernel build entrypoint"]
cmd = "scripts/check-kernel-build-entrypoint.sh"
timeout_secs = 120

# WHY (#546): the canonical build is scripts/kernel-build.sh — crates/thumos/
# .cargo/config.toml pins target + link script + the -D warnings gate (#431).
# The previous inline stage passed RUSTFLAGS via env, which CLOBBERED the
# config rustflags and silently dropped the zero-warning gate on this surface.
[stages."kernel build"]
cmd = "sh -c 'rustup target add armv7a-none-eabi && scripts/kernel-build.sh'"
timeout_secs = 900

# WHY (#233/#546): production must fail keyless, refuse the dev key, build
# with an ephemeral key — same script ci.yml calls.
[stages."kernel trust anchor"]
cmd = "scripts/witness/trust-anchor.sh"
timeout_secs = 900

# WHY (#546): the kernel's i686 host suite was previously advisory-only on
# this surface; the admission gate now runs the identical script as ci.yml.
[stages."kernel host tests"]
cmd = "sh -c 'rustup target add i686-unknown-linux-gnu && scripts/kernel-host-tests.sh'"
timeout_secs = 1800

# WHY (#663): the kernel crate is excluded from the workspace, so no
# --workspace clippy invocation in the repo ever reaches crates/thumos --
# build.rs sat with 18 -D warnings errors, unseen, for months. Runs right
# after "kernel host tests", which just built this exact i686 target — a
# cache hit, not a fresh compile — so this stage stays cheap in this
# pipeline position specifically; do not reorder it away from that stage.
[stages."kernel clippy"]
cmd = "sh -c 'rustup target add i686-unknown-linux-gnu && scripts/kernel-clippy.sh'"
timeout_secs = 600

# WHY (#551; #645): declared-vs-executed audit for the kernel test
# obligations — tests-count drift is checked against the RUNNABLE set
# `cargo nextest list` reports, not source text (#645: text-regex counted a
# module's tests even when a #[cfg] excluded it from every test build).
# Runs right after "kernel host tests", which just built this exact i686
# target — a cache hit, not a fresh compile — so this stage stays cheap in
# this pipeline position specifically; do not reorder it away from that
# stage.
[stages."target test ledger"]
cmd = "scripts/check-target-test-ledger.sh"
timeout_secs = 300

# WHY: #534/#862/#879 make the board seam a structural invariant, not a
# promise — reds on an MT6739_* identifier outside board::m7, a board-MMIO
# value re-declared outside board/, or known exact-form PWRAP/legacy CPU-power
# spellings and common two-literal expressions before an accepted transaction
# exists. Source-level, cheap.
# WHY (#835/#836): the `zeroize` feature on a keyed crypto crate has no
# behavioural signature -- without it everything compiles and runs identically
# and the AES round-key schedule is simply left resident after use. No test
# fails and no warning fires, so a manifest added without it regresses the
# guarantee silently. Source-level, cheap.
[stages."crypto zeroize features"]
cmd = "scripts/check-crypto-zeroize-features.sh"
timeout_secs = 120

[stages."board seam"]
cmd = "scripts/check-board-seam.sh"
timeout_secs = 300

# WHY (#917): board/mod.rs and link.ld each state the kernel window's upper
# bound, in languages that cannot read each other. The larger-link.ld direction
# is the dangerous one -- the linker accepts an image past the last mapped
# section, and the first symptom is a data abort on device, not a build error.
# Also reports remaining headroom when a release ELF is present.
[stages."kernel window"]
cmd = "scripts/check-kernel-window.sh"
timeout_secs = 120

# WHY (#545): convergence is a ratchet, not a wish — port markers and
# stale expectations only ever decrease, and every duplicated pair names
# its disposition. Source-level, cheap.
[stages."convergence"]
cmd = "scripts/check-convergence.sh"
timeout_secs = 300

# WHY (#546/#875): the full QEMU witness matrix (boot + watchdog + fault +
# sleep + fork + exec + forkexec + guard + brk + signal + crashloop) as one
# canonical runner — the exact scripts ci.yml executes step-by-step.
[stages."kernel qemu witnesses"]
cmd = "scripts/witness-run-all.sh"
timeout_secs = 3600

# WHY (#550): the capability inventory is the SSOT for what is wired; reds
# on unclassified modules, phantom entries, or a witness that did not fire
# in the boot.log the witness stage just produced.
[stages."wiring inventory"]
cmd = "scripts/check-wiring-inventory.sh"
timeout_secs = 300

# WHY: the crate count was hand-typed in CLAUDE.md, ARCHITECTURE.md, and
# _llm/README.md and disagreed with itself and with Cargo.toml; docs/
# MANIFEST.toml omitted real docs/ files and nothing referenced it.
# Source-level, cheap.
[stages."doc inventory"]
cmd = "scripts/check-doc-inventory.sh"
timeout_secs = 300

# WHY: metaxu-core and the excluded kernel crate cannot inherit every
# dependency, so both restate versions the workspace also declares.
# metaxu-core's header asserts they match exactly; that was false twice in one
# day (ed25519-dalek 2 against a workspace on 3, compact_str 0.8 against 0.10)
# and two majors of one crate are two distinct types across a boundary these
# crates exchange values over. Source-level, cheap.
[stages."pin parity"]
cmd = "scripts/check-pin-parity.sh"
timeout_secs = 120

# WHY: llms.txt directs agents to _llm/current_state.toml for current blockers,
# and that file is hand-maintained. Its open-threads block named three issues,
# two of them closed for weeks. A machine-readable file reads as data, so a
# stale entry there misdirects harder than the same claim in prose would.
[stages."llm issue refs"]
cmd = "scripts/check-llm-issue-refs.sh"
timeout_secs = 120

# WHY (#688): crates/thumos is excluded from the workspace and carries its own
# lockfile. release-please updates it through an explicit selector that once
# named a single crate, so six first-party versions sat three releases behind
# while cargo silently rewrote the file on every build. An enumeration of
# things that grow goes stale quietly; this makes it loud.
[stages."kernel lockfile versions"]
cmd = "scripts/check-external-lockfile-versions.sh crates/thumos/Cargo.lock"
timeout_secs = 60

# WHY (#768): fuzz/ is a second standalone resolution root (its own
# `[workspace]`) with the same shape of risk as the kernel lockfile above —
# and it hit the identical drift independently: three first-party crates sat
# nine releases stale and two real path-deps (asphaleia-core, klesis-core)
# were entirely absent from the lock, so cargo-audit/cargo-deny never scanned
# them. See scripts/check-external-lockfile-versions.sh's header for why the
# same script now covers both files instead of a second hand copy.
[stages."fuzz lockfile versions"]
cmd = "scripts/check-external-lockfile-versions.sh fuzz/Cargo.lock"
timeout_secs = 60

# WHY (#819): a fuzz target that imports a workspace crate the kernel does not
# link certifies a path that never runs on a device — worse than no signal,
# because a green fuzz run reads as coverage. Graded per MODULE: one crate can
# have both a module that delegates into the shared core and one that does not.
# The exemption table is a ratchet — an unlisted gap fails, and so does a listed
# gap that has since been fixed.
[stages."fuzz target coverage"]
cmd = "scripts/check-fuzz-target-coverage.sh"
timeout_secs = 120

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --all-targets --locked --jobs 8 -- -D warnings"
timeout_secs = 900

[stages."cargo nextest"]
cmd = "cargo nextest run --workspace --locked --build-jobs 8 --test-threads 8"
timeout_secs = 1800

[stages."kanon lint"]
cmd = "kanon lint . --summary"
timeout_secs = 600
