[workspace] # kanon:ignore ORCHESTRATION/main-worktree-commit-prohibited -- T0-direct session on feature branch, not a dispatch worktree
resolver = "2"
members = [
    "crates/aither",
    "crates/aither-core",
    "crates/asphaleia",
    "crates/asphaleia-core",
    "crates/eidolon",
    "crates/eidolon-core",
    "crates/haphe",
    "crates/kelyphos",
    "crates/klesis",
    "crates/klesis-core",
    "crates/krypta",
    "crates/leipsanon",
    "crates/metaxu",
    "crates/metaxu-core",
    "crates/pteron",
    "crates/sema",
    "crates/sema-core",
    "crates/hypographe",
    "crates/stegnos",
    "crates/topos",
    "crates/topos-core",
]
exclude = ["crates/thumos"]

[workspace.package]
version = "0.9.0"
edition = "2024"
# WHY: match the toolchain we actually build and test against.
rust-version = "1.94"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/forkwright/thumos"
publish = false

[workspace.lints.rust]
# WHY: bare-metal kernel crate legitimately needs unsafe for MMIO, page
# tables, interrupt handlers. Workspace crates should not need it but
# some (stegnos, leipsanon) use unsafe for crypto/memory operations.
# Deny would break compilation. Warn ensures every use is visible.
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WHY(#126): Workspace library crates tightened from pub to pub(crate).
# Clippy suppresses these lints for pub items (breaking-change avoidance)
# but applies them to pub(crate). Allowing restores the pre-refactor
# behaviour until the kernel binary imports these crates.
redundant_pub_crate = "allow"
trivially_copy_pass_by_ref = "allow"
needless_pass_by_ref_mut = "allow"
unnecessary_wraps = "allow"
enum_variant_names = "allow"
struct_field_names = "allow"

[workspace.dependencies]
# Syscalls (no libc)
rustix = { version = "1", features = [
    "fs",
    "net",
    "process",
    "mm",
    "event",
    "time",
] }

# Crypto
#
# WHY `zeroize` on all three, and why all three (#835/#836): an AES round-key
# schedule is trivially reversible to the key that produced it, so leaving one
# resident defeats the `Zeroizing` discipline the crypto crates already apply
# to the key bytes themselves. `aes-gcm`'s own `zeroize` feature is NOT
# sufficient and does not make `Aes256Gcm: ZeroizeOnDrop` -- read at
# aes-gcm-0.11.0 `src/lib.rs:233`, it clears only the `ghash_key` temporary
# during construction, and `AesGcm` has no `Drop` of its own. Its two keyed
# fields scrub themselves only through their OWN features: `aes/zeroize` gives
# `Aes256: ZeroizeOnDrop` (aes-0.9.2 `src/lib.rs:437-445`), and `ghash/zeroize`
# forwards to `polyval/zeroize`, which is what arms the otherwise-empty `Drop`
# body at polyval-0.7.3 `src/lib.rs:111-119`. Enabling any one of the three
# leaves keyed state resident, which is why they are declared together here
# rather than per-crate. `scripts/check-crypto-zeroize-features.sh` fails on a
# manifest that adds one of these without the feature.
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
# Not used directly by any crate: declared so a consumer of `aes-gcm` can turn
# on the GHASH half, which `aes-gcm` does not forward.
ghash = { version = "0.6", features = ["zeroize"] }
# WHY declared here rather than per-crate: five crates hold key material and
# each needs the same scrubbing primitive. A version this repo pins in five
# places is a version it can disagree with itself about.
zeroize = { version = "1", default-features = false }
# WHY declared rather than reached for ad hoc: a constant-time comparison is
# only constant-time if it is the same one everywhere, and `subtle` inserts the
# optimisation barriers a hand-rolled loop cannot promise.
subtle = { version = "2", default-features = false }
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }

# Networking
smoltcp = { version = "0.14", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
] }

# Parsing
nom = "8"

# Display
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

# Errors
snafu = "0.9"

# Logging
log = "0.4"

# Time
jiff = "0.2"
ulid = { version = "3", default-features = false }

# Strings
compact_str = "0.10"

# Async (for userspace daemons)
tokio = { version = "1", features = [
    "rt",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
    "macros",
] }
