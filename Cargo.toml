[workspace] # kanon:ignore ORCHESTRATION/main-worktree-commit-prohibited -- T0-direct session on feature branch, not a dispatch worktree
resolver = "2"
members = [
    "crates/aither",
    "crates/asphaleia",
    "crates/eidolon",
    "crates/haphe",
    "crates/kelyphos",
    "crates/klesis",
    "crates/krypta",
    "crates/leipsanon",
    "crates/metaxu",
    "crates/pteron",
    "crates/sema",
    "crates/stegnos",
    "crates/topos",
]
exclude = ["crates/thumos"]

[workspace.package]
version = "0.1.13"
edition = "2024"
# WHY: match the toolchain we actually build and test against.
rust-version = "1.94"
license = "LicenseRef-PolyForm-Shield-1.0.0"
repository = "https://github.com/forkwright/thumos"
publish = false

[workspace.lints.rust]
# WHY: bare-metal kernel crate legitimately needs unsafe for MMIO, page
# tables, interrupt handlers. Workspace crates should not need it but
# some (stegnos, leipsanon) use unsafe for crypto/memory operations.
# Deny would break compilation. Warn ensures every use is visible.
unsafe_code = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WHY(#126): Workspace library crates tightened from pub to pub(crate).
# Clippy suppresses these lints for pub items (breaking-change avoidance)
# but applies them to pub(crate). Allowing restores the pre-refactor
# behaviour until the kernel binary imports these crates.
redundant_pub_crate = "allow"
trivially_copy_pass_by_ref = "allow"
needless_pass_by_ref_mut = "allow"
unnecessary_wraps = "allow"
enum_variant_names = "allow"
struct_field_names = "allow"

[workspace.dependencies]
# Syscalls (no libc)
rustix = { version = "1", features = [
    "fs",
    "net",
    "process",
    "mm",
    "event",
    "time",
] }

# Crypto
aes-gcm = "0.10"
ed25519-dalek = "2"
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }

# Networking
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
] }

# Parsing
nom = "8"

# Display
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }

# Errors
snafu = "0.8"

# Logging
log = "0.4"

# Time
jiff = "0.2"
ulid = { version = "1", default-features = false }

# Strings
compact_str = "0.8"

# Async (for userspace daemons)
tokio = { version = "1", features = [
    "rt",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
    "macros",
] }
