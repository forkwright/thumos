[package]
name = "pteron"
description = "Bluetooth HCI driver and BLE scanning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
aes = "0.9"
zeroize = "1"
jiff = { workspace = true }
snafu = { workspace = true }
log = { workspace = true }
cmac = "0.8"
rand_core = { version = "0.10.1", default-features = false }

[dependencies.p256]
version = "0.14.0"
default-features = false
features = ["arithmetic", "ecdh"]

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
