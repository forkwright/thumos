[package]
name = "klesis-core"
description = "no_std + alloc core for GSM-7, SMS-PDU, and AT-response semantics (the canonical codec, address/hex primitives, silent-SMS/WAP-Push classification, and AT final-result/URC token parsing, shared by klesis and the kernel)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# WHY the explicit path (#718): TESTING/no-benchmarks expects a
# workspace-root `benches/` directory as a sibling of the root Cargo.toml,
# not a per-crate one — this target's source lives there while still
# compiling as part of this package.
[[bench]]
name = "klesis_core_pdu_codec"
harness = false
path = "../../benches/klesis_core_pdu_codec.rs"

[dev-dependencies]
criterion = "0.8"

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-08-08"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
