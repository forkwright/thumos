[package]
name = "aither"
description = "WiFi driver and WPA2/3 supplicant"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
getrandom = { workspace = true }
# WHY (#545, #819): the canonical EAPOL frame parse/encode, PMK/PTK
# derivation, MIC, and 4-way handshake state machine live in aither-core,
# shared no_std+alloc with the kernel -- one implementation on both sides,
# fuzzed (fuzz_wpa/fuzz_eapol import this crate, which now delegates).
# hmac/pbkdf2/sha1 moved with them; nothing else in this crate uses those
# crates directly.
aither-core = { path = "../aither-core" }
nom = { workspace = true }
smoltcp = { workspace = true }
snafu = { workspace = true }
log = { workspace = true }

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
