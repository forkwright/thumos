[package]
name = "metaxu"
description = "Aletheia/Thumos thin-client capability bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "pylon-bridge"
path = "src/bin/pylon_bridge.rs"
required-features = ["pylon-bin"]

[features]
# WHY (#544 on-device leg): gates `mod pylon` visible (not `pub(crate)`) and
# the `pylon-bridge` binary above into existence. Off by default -- the
# reference endpoint double never ships as part of a normal `cargo build`;
# it exists only for `cargo test` (unit tests) and this opt-in feature (a
# real host process the QEMU witness launches).
pylon-bin = []

[dependencies]
compact_str = { workspace = true, features = ["serde"] }
ed25519-dalek = { workspace = true, features = ["serde"] }
# WHY (#545): the canonical envelope framing, signed-grant verification,
# typed task/response payloads, and authenticated-session logic live in
# metaxu-core, shared no_std+alloc with the kernel -- one implementation on
# both sides of the wire (see metaxu-core/src/lib.rs).
metaxu-core = { path = "../metaxu-core" }
hmac = { workspace = true }
sha2 = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
snafu = { workspace = true }
ulid = { workspace = true }

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
