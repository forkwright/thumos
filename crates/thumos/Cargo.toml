[package]
name = "thumos"
description = "Thumos kernel: bare-metal Rust OS for the MT6739"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/forkwright/thumos"

[features]
# WHY (issue #372): dev-only kernel debug console (UART shell). Deliberately
# absent from `default` -- a shipped/production build must not merely
# *default* to excluding it, it must be structurally incapable of
# containing it (see main.rs's `mod console` cfg gate + the
# debug-console/production compile_error! there).
debug-console = []
# WHY (issue #372): marks a build as the shippable/flashable artifact.
# Mutually exclusive with `debug-console` -- main.rs `compile_error!`s if
# both are set, so an `--all-features` invocation (which enables both at
# once) fails to compile instead of silently producing a console-carrying
# release binary. The ship/bring-up build should pass `--features
# production` (see design notes: CONTRIBUTING.md / ARCHITECTURE.md /
# AGENTS.md / ci.yml kernel job need a companion update, out of scope for
# this crate-local edit set).
production = []
# WHY: QEMU `-machine virt` bring-up harness -- remaps UART/GIC base constants
# (kconfig.rs), swaps the MTK UART driver for a PL011 (uart_pl011.rs), no-ops
# SoC-only MMIO on the timer-IRQ path (watchdog/DVFS/MCDI/DSI), skips init of
# hardware virt does not model (eMMC/display/keypad/USB/CCCI), and reports
# boot outcome via semihosting exit codes. Never enabled by default; the
# MT6739 build is unchanged without it. Mutually exclusive with `production`
# (see main.rs compile_error!).
qemu = []

[dependencies]
aes = { version = "0.8", default-features = false }
# WHY: Megolm needs AES-256-CBC (audit #231). Use the audited RustCrypto `cbc`
# mode crate rather than hand-rolled chaining/padding. no_std verified for
# i686 + armv7a-none-eabi (crate is `no-std` categorised, alloc-only feature set).
cbc = { version = "0.1", default-features = false, features = [
    "alloc",
    "block-padding",
] }
ed25519-dalek = { version = "2", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "alloc",
] }
xts-mode = { version = "0.5", default-features = false }

# WHY (#233): build.rs sources the boot trust anchor (env-provisioned under
# `production`, the committed deliberately-public dev key otherwise), refuses
# the forgeable RFC 8032 test keys / off-curve bytes / dev-key-under-
# production at build time, and emits boot_key.rs into OUT_DIR. ed25519-dalek
# validates point decompression host-side with the same crate the kernel
# verifies with.
[build-dependencies]
ed25519-dalek = { version = "2", default-features = false }

# WHY: the kernel crate is excluded from the workspace (bare-metal target)
# but must still enforce the same lint quality floor. These match the
# workspace lints in the root Cargo.toml.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WHY: bare-metal kernel uses todo!() as a legitimate marker for Phase 07+
# features that compile but are not yet wired. deny would break the build.
# Tracked via GitHub issues (#81) with a plan to link each to an issue number.
todo = "warn"
# Phase 07 audit: enforce safe error handling in kernel code.
# Tests may still use .expect("msg") since lints are per-crate, not per-target.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
