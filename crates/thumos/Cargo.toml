[package]
name = "thumos"
description = "Thumos kernel: bare-metal Rust OS for the MT6739"
version = "0.7.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/forkwright/thumos"

[features]
# WHY (issue #372): dev-only kernel debug console (UART shell). Deliberately
# absent from `default` -- a shipped/production build must not merely
# *default* to excluding it, it must be structurally incapable of
# containing it (see main.rs's `mod console` cfg gate + the
# debug-console/production compile_error! there).
debug-console = []
# WHY (issue #372): marks a build as the shippable/flashable artifact.
# Mutually exclusive with `debug-console` -- main.rs `compile_error!`s if
# both are set, so an `--all-features` invocation (which enables both at
# once) fails to compile instead of silently producing a console-carrying
# release binary. The ship/bring-up build should pass `--features
# production` (see design notes: CONTRIBUTING.md / ARCHITECTURE.md /
# AGENTS.md / ci.yml kernel job need a companion update, out of scope for
# this crate-local edit set).
production = []
# WHY: QEMU `-machine virt` bring-up harness -- remaps UART/GIC base constants
# (kconfig.rs), swaps the MTK UART driver for a PL011 (uart_pl011.rs), no-ops
# SoC-only MMIO on the timer-IRQ path (watchdog/DVFS/MCDI/DSI), skips init of
# hardware virt does not model (eMMC/display/keypad/USB/CCCI), and reports
# boot outcome via semihosting exit codes. Never enabled by default; the
# MT6739 build is unchanged without it. Mutually exclusive with `production`
# (see main.rs compile_error!).
qemu = []
# WHY (#487 fault-handling): CI fault-injection harness -- executes a deliberate
# PL1 `udf` after boot-complete so CI permanently pins the kernel-fault-HALTS
# branch (qemu exit 4, no service-loop resume). Only meaningful with `qemu`;
# mutually exclusive with `production` (main.rs compile_error!).
kfault-probe = []
# WHY (#492 fault supervision): CI crash-loop harness -- kinit spawns /crasher
# (a program that data-aborts on every launch) and registers it SUPERVISED, so
# CI can witness PID 0's restart policy end to end: restart x3, then give up.
# A THUMOS_INIT_VARIANT cannot do this -- variants only select /init's `_start`
# body, while supervised registration is kinit behaviour. Only meaningful with
# `qemu`; mutually exclusive with `production` (main.rs compile_error!).
crashloop-probe = []
# WHY (#544 on-device leg): CI round-trip harness -- kinit spawns
# `/metaxu_probe`, a userspace process that syscalls into a self-issued dev
# grant + a real `metaxu-core` authenticated request/response exchange over
# the second PL011 (`board::UART1_BASE`), against a host `pylon-bridge`
# process (crates/metaxu, `pylon-bin` feature). Only meaningful with `qemu`
# (main.rs compile_error! requires it -- the second PL011 exists only under
# QEMU's `-machine virt,secure=on`, which `scripts/qemu-runner.sh` enables
# ONLY when this feature's witness script asks); mutually exclusive with
# `production` (main.rs compile_error!).
metaxu-probe = []
# WHY (#544 negative-case witness): selects an ALREADY-EXPIRED variant of
# metaxu-probe's dev grant (metaxu_bridge::dev_identity::dev_grant) instead
# of the default one -- proves evaluate_submission's expiry check denies
# through the REAL syscall dispatch under a real boot, not just the offline
# host unit test. Implies `metaxu-probe` (so it inherits both of that
# feature's compile_error! gates -- production exclusion, qemu requirement
# -- without restating them); mutually exclusive with
# `metaxu-probe-no-capability` (metaxu_bridge.rs compile_error!). Never
# meaningful outside scripts/witness/metaxu-negative.sh.
metaxu-probe-expired-grant = ["metaxu-probe"]
# WHY (#544 negative-case witness): selects a variant of metaxu-probe's dev
# grant that verifies (unexpired, correctly bound) but never carries
# `SmsSend` -- proves evaluate_submission's capability check denies through
# the REAL syscall dispatch under a real boot. Implies `metaxu-probe`;
# mutually exclusive with `metaxu-probe-expired-grant` (metaxu_bridge.rs
# compile_error!). Never meaningful outside
# scripts/witness/metaxu-negative.sh.
metaxu-probe-no-capability = ["metaxu-probe"]

[dependencies]
aes = { version = "0.8", default-features = false }
# WHY (#545): the canonical threat-semantics types (ThreatLevel/Calibration/
# band boundaries) live in sema-core, shared with the workspace `sema` crate
# — one implementation, no drifted duplicate in screen_threat.
# WHY (#740/#545): the display layout geometry (screen size, the three
# zone heights, and everything derived from them) lives in eidolon-core,
# shared with eidolon. Two definitions of STATUS_BAR_HEIGHT disagreed by
# 4px, which shifts every zone boundary without failing anything.
eidolon-core = { path = "../eidolon-core" }
sema-core = { path = "../sema-core", default-features = false }
# WHY (#545): the canonical DNS-surveillance-policy semantics (QNAME
# extraction, the blocklist domain list, and its suffix-matching rule) live
# in asphaleia-core, shared with the workspace `asphaleia` crate -- one
# implementation, no drifted duplicate in firewall.rs. IPv4/TCP/UDP header
# parsing is NOT yet converged: firewall.rs::parse_packet still does its own
# header arithmetic (see docs/convergence.toml's "firewall" pair for the
# tracked disposition).
asphaleia-core = { path = "../asphaleia-core", default-features = false }
# WHY (#545, #662): the canonical GSM-7 codec, SMS-PDU byte primitives, and
# the silent-SMS/WAP-Push classification live in klesis-core, shared with the
# workspace `klesis` crate. The kernel's hand-port had dropped the
# surveillance classification entirely — it read the PID and discarded it —
# so the detection existed only in the layer that never runs on the phone.
klesis-core = { path = "../klesis-core", default-features = false }
# WHY (#545): the canonical NMEA checksum framing, coordinate/fix-quality
# semantics, and GGA/RMC sentence parsing live in topos-core, shared with the
# workspace `topos` crate. The kernel's hand-port truncated an overflowing
# fix-quality byte instead of range-checking it, validated a checksum field
# with only one hex digit as a distinct-but-related bug lived on the
# `topos` side, and neither side bounded latitude/longitude or the parsed
# RMC clock fields before treating them as trustworthy.
topos-core = { path = "../topos-core", default-features = false }
# WHY: Megolm needs AES-256-CBC (audit #231). Use the audited RustCrypto `cbc`
# mode crate rather than hand-rolled chaining/padding. no_std verified for
# i686 + armv7a-none-eabi (crate is `no-std` categorised, alloc-only feature set).
cbc = { version = "0.1", default-features = false, features = [
    "alloc",
    "block-padding",
] }
# WHY (#545, #544 on-device leg): the canonical Aletheia/Thumos envelope
# framing, signed-grant verification, and typed task/response payloads live
# in metaxu-core, shared no_std+alloc with the `metaxu` workspace crate --
# one implementation on both sides of the wire, consumed by
# `metaxu_bridge.rs` under the `metaxu-probe` feature.
metaxu-core = { path = "../metaxu-core", default-features = false }
# WHY: metaxu-core's public TaskRequest/DeviceIdentityRef surface names
# these types directly, so `metaxu_bridge.rs` (which builds them) needs its
# own direct dependency -- Rust does not let a crate name a transitive
# dependency's types without declaring the dependency itself. Versions
# match metaxu-core's workspace pins (compact_str "0.8", ulid "1"
# default-features=false).
compact_str = { version = "0.8", default-features = false, features = [
    "serde",
] }
ulid = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = [
    "digest",
    "serde",
] }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.12", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "alloc",
] }
xts-mode = { version = "0.5", default-features = false }

# WHY (#233): build.rs sources the boot trust anchor (env-provisioned under
# `production`, the committed deliberately-public dev key otherwise), refuses
# the forgeable RFC 8032 test keys / off-curve bytes / dev-key-under-
# production at build time, and emits boot_key.rs into OUT_DIR. ed25519-dalek
# validates point decompression host-side with the same crate the kernel
# verifies with.
[build-dependencies]
ed25519-dalek = { version = "2", default-features = false }

# WHY (#615): dev-only so ui.rs's kernel-local `Key` enum can be pinned
# against the REAL `haphe::input::Key` in a host test, instead of a
# hand-copied constant that could itself drift unnoticed. Dev-dependencies
# are excluded from `cargo build --release` (the armv7a-none-eabi shipped
# kernel), so this adds no coupling to the flashed binary -- only to the
# `--target i686-unknown-linux-gnu` test target.
[dev-dependencies]
haphe = { path = "../haphe" }

# WHY: the kernel crate is excluded from the workspace (bare-metal target)
# but still enforces the same lint floor -- EXCEPT unsafe_code. A bare-metal
# kernel is inherently unsafe (MMIO, global_asm!, raw register access);
# `unsafe_code = "warn"` fired ~484 non-actionable warnings (one per unsafe
# block) and blocked a `-D warnings` gate. The real safety discipline is the
# per-block `// SAFETY:` comments, enforced by kanon RUST/unsafe-needs-safety.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# WHY: bare-metal kernel uses todo!() as a legitimate marker for Phase 07+
# features that compile but are not yet wired. deny would break the build.
# Tracked via GitHub issues (#81) with a plan to link each to an issue number.
todo = "warn"
# Phase 07 audit: enforce safe error handling in kernel code.
# Tests may still use .expect("msg") since lints are per-crate, not per-target.
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
