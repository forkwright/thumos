[package]
name = "thumos"
description = "Thumos kernel: bare-metal Rust OS for the MT6739"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/forkwright/thumos"

[dependencies]
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "alloc",
] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
