# WHY: Block merges on known vulnerabilities and license/source/ban
# violations. Runs `cargo audit` (RustSec DB) and `cargo deny check`
# (licenses, sources, bans, advisories) on every PR and daily against main
# so newly-published CVEs against existing deps are caught even when no PR
# is open. See standards/SUPPLY-CHAIN.md.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    # Non-overlapping with codeql (Wed 08:00 CST) and stale (Sun 06:00 CST).
    - cron: "23 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    # WHY: checks licenses, banned crates, source registries, and the
    # RustSec advisory DB using deny.toml's ignore list. Any finding fails
    # the job — suppressions require a deny.toml entry with a WHY comment,
    # not silent --ignore flags.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # PROJECT: security hardening — never expose token to steps
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-deny
      - name: Lockfile manifest guard
        # WHY (#547): an unclassified new Cargo.lock must fail the required
        # gate. The manifest is the explicit scanned-set; drift in either
        # direction (unscanned lockfile, entry for a deleted one) reds here.
        run: scripts/check-lockfile-manifest.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny (all graphs)
        # WHY (#547): advisories/licenses/bans/sources over EVERY graph in
        # the lockfile manifest (workspace, kernel, fuzz) — one script and
        # one deny.toml SSOT, findings attributed per-graph.
        run: scripts/security-scan.sh deny

  cargo-audit:
    # WHY: cargo-deny's advisories check overlaps but uses a different code
    # path; running cargo-audit independently protects against bugs or
    # config drift disabling one of the two.
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit (all graphs)
        # WHY: -D unmaintained,unsound,yanked escalates those categories
        # to errors (default is warning only). Suppressions go through
        # .cargo/audit.toml, which mirrors deny.toml's [[advisories.ignore]]
        # entries — no silent --ignore flags here. Runs over every graph in
        # the lockfile manifest, not just the workspace root (#547).
        run: scripts/security-scan.sh audit

  osv-scanner:
    name: osv-scanner
    # WHY (direct CLI, not the reusable workflow): the org/repo Actions policy
    # rejects external reusable workflows (google/osv-scanner-action/...), which
    # startup-failed the whole Security workflow. Invoking the pinned CLI as a
    # normal run step needs only the default read-only token and no external
    # reusable-workflow permission. fail-on-vuln is the CLI default.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install osv-scanner (pinned + checksum-verified)
        env:
          OSV_VERSION: v2.4.0
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan all Cargo.lock graphs (fail on vulnerability)
        # WHY (#547): the kernel and fuzz lockfiles carry their own advisories
        # surface; one script loops the manifest, per-graph attribution.
        run: scripts/security-scan.sh osv ./osv-scanner
