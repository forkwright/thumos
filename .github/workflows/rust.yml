name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: armv7a-none-eabi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: |
          RUSTFLAGS="-C link-arg=-T${GITHUB_WORKSPACE}/crates/thumos/link.ld" \
            cargo build --release --target armv7a-none-eabi --manifest-path crates/thumos/Cargo.toml
      - run: cargo install cargo-deny && cargo deny check
