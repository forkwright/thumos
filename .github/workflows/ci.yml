# WHY: The real quality gate — rustfmt, clippy, and the full test suite for
# both the workspace crates (host) and the excluded bare-metal kernel binary
# (i686 host tests + armv7a cross-compile). Mirrors the local `kanon gate` and
# the stages in .kanon-ci.toml, with cargo concurrency pinned per CI.md.
#
# Kernel unit tests run on the 32-bit i686 target because the kernel's syscall
# ABI uses u32 addresses; a 64-bit host truncates real pointers and crashes.
# See AGENTS.md § Build. cargo-nextest is the canonical runner — its per-test
# process isolation is required by tests that touch the kernel's static-mut
# globals.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PROJECT: explicit top-level default deny; jobs read only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # WHY: fastest check first — a formatting miss fails in seconds without
    # spending build minutes. Covers both the workspace crates and the
    # bare-metal kernel crate (excluded from the workspace, so it needs its
    # own manifest-path invocation).
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false # PROJECT: never expose the token to steps
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check
      # WHY: the kernel crate is excluded from the workspace, so --all misses it.
      - run: cargo fmt --manifest-path crates/thumos/Cargo.toml --check

  workspace:
    # WHY: clippy (deny warnings) + the workspace test suite for the 13
    # library crates. Concurrency pinned to 8 per CI.md § kanon-ci caps.
    name: workspace clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets --jobs 8 -- -D warnings
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version ^0.9
      - name: nextest
        run: cargo nextest run --workspace --build-jobs 8 --test-threads 8
      - name: doctests
        # WHY: cargo nextest does not run doctests; this covers them (and is
        # the workspace's `cargo test` gate step).
        run: cargo test --doc --workspace --jobs 8

  kernel:
    # WHY: the bare-metal kernel is excluded from the workspace, so its host
    # unit tests (i686, u32-faithful ABI) and its real-target cross-compile
    # (armv7a-none-eabi) need a dedicated job. The .cargo/config.toml inside
    # crates/thumos pins the armv7a target + linker script, so the build step
    # only needs to run from that directory.
    name: kernel (i686 tests + armv7a build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.94"
          targets: i686-unknown-linux-gnu, armv7a-none-eabi
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: kernel
          workspaces: crates/thumos
      - name: Install 32-bit link support
        # WHY: linking the i686 test binary needs the multilib crt objects.
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version ^0.9
      - name: Kernel host tests (i686)
        working-directory: crates/thumos
        run: cargo nextest run --bin thumos --target i686-unknown-linux-gnu --build-jobs 8 --test-threads 8
      - name: Kernel cross-compile (armv7a) + zero-warning gate (#431)
        working-directory: crates/thumos
        # WHY (#431): the zero-warning gate (-D warnings) lives in
        # crates/thumos/.cargo/config.toml's armv7a rustflags (always-on, dev +
        # CI, and it does not clobber the linker-script flag the way an env
        # RUSTFLAGS would). This step just builds; a new warning fails it.
        run: cargo build --release --target armv7a-none-eabi --jobs 8
      - name: Trust-anchor build guard (#233)
        working-directory: crates/thumos
        # WHY: a production image must FAIL to build without a provisioned
        # key, must REFUSE the committed (deliberately public) dev key, and
        # must BUILD with a real key -- proven here with an ephemeral one.
        # Dev/qemu/host builds keep building keylessly (the steps above).
        run: |
          set -uo pipefail
          if cargo check --release --target armv7a-none-eabi --features production 2>keyless-err.log; then
            echo 'FAIL: production build succeeded without THUMOS_BOOT_KEY_PUB'; exit 1
          fi
          grep -q 'THUMOS_BOOT_KEY_PUB' keyless-err.log || { echo 'FAIL: keyless production error lacks provisioning message'; cat keyless-err.log; exit 1; }
          if THUMOS_BOOT_KEY_PUB=keys/dev/boot-dev.pub cargo check --release --target armv7a-none-eabi --features production 2>devkey-err.log; then
            echo 'FAIL: production build accepted the dev key'; exit 1
          fi
          openssl genpkey -algorithm ed25519 -out /tmp/ci-boot.pem
          openssl pkey -in /tmp/ci-boot.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n' > /tmp/ci-boot.pub
          THUMOS_BOOT_KEY_PUB=/tmp/ci-boot.pub cargo check --release --target armv7a-none-eabi --features production
      - name: Install qemu-system-arm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Kernel QEMU boot + service loop (real kinit -> boot-complete -> loop)
        working-directory: crates/thumos
        # WHY: the `qemu` feature retargets peripheral addresses to the QEMU
        # `virt` board (UART/GIC) and boots the REAL kinit under
        # qemu-system-arm, hands off to the kardia service loop (PID 0), and
        # exits via semihosting after QEMU_TICK_CAP serviced ticks (0 = the
        # loop ran, not merely that boot reached its end). Verified in
        # emulation without the physical MT6739. Runner exit codes: 0=loop
        # ran; 5=service-loop stalled (#461 tick-source class); 1=panic;
        # 2/3/4=aborts; 124=hang (runner timeout). boot.log is ALWAYS printed
        # and the missing marker named, so a stall is a diagnostic, not a bare
        # timeout.
        run: |
          set -uo pipefail
          cargo build --release --target armv7a-none-eabi --features qemu --jobs 8
          rc=0
          THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee boot.log || rc=$?
          echo "=== boot.log (runner rc=$rc) ==="; cat boot.log; echo "=== end boot.log ==="
          test "$rc" -eq 0 || { echo "FAIL: runner exit $rc (0=ok 5=loop-stall#461 1=panic 2/3/4=abort 124=hang)"; exit 1; }
          grep -q 'THUMOS v0.1.0' boot.log || { echo 'FAIL: missing banner'; exit 1; }
          grep -q 'THUMOS-QEMU: boot-complete' boot.log || { echo 'FAIL: boot did not complete'; exit 1; }
          grep -q 'THUMOS-QEMU: service-loop ticks=' boot.log || { echo 'FAIL: service loop never serviced a tick'; exit 1; }
          # Fail-closed (#217): the qemu boot has NO boot medium, so medium
          # trust is never established -- assert it degraded-LOCKED and that
          # every MEDIUM-trust-dependent step stays refused (a fail-OPEN
          # regression would drop these lines).
          grep -q 'Secure boot: DEGRADED' boot.log || { echo 'FAIL: untrusted boot did not report degraded (fail-closed regression)'; exit 1; }
          grep -q 'Passphrase entry refused' boot.log || { echo 'FAIL: passphrase not refused on an untrusted boot (fail-OPEN regression)'; exit 1; }
          grep -q 'Audit log deferred' boot.log || { echo 'FAIL: audit not deferred on an untrusted boot (fail-OPEN regression)'; exit 1; }
          # Measured userspace (#480): the image-resident initramfs is signed by
          # the boot anchor, so userspace_image_verified is set and /init spawns
          # + runs through the REAL gate (no bypass) even though the MEDIUM is
          # degraded. Assert the crypto verification fired AND userspace actually
          # executed a syscall (its svc Write reached the UART) -- if the
          # signature check regressed, /init would be refused and these drop.
          grep -q 'image-resident initramfs signature verified' boot.log || { echo 'FAIL: initramfs signature was not verified (measured-userspace regression)'; exit 1; }
          grep -q '/init spawned' boot.log || { echo 'FAIL: /init did not spawn from the verified initramfs'; exit 1; }
          grep -q 'init: hello from userspace' boot.log || { echo 'FAIL: userspace /init did not run + syscall (PL0->dispatch->UART)'; exit 1; }
          # #400 render foundation: the kardia service loop paints the home
          # frame through the real screen-dispatch path (not a boot-time one-shot),
          # into a synthetic framebuffer under qemu (virt models no display). The
          # painted-pixel count proves the render EXECUTED and produced content --
          # the UI render path was entirely dead under qemu before this.
          grep -q 'kardia: frame rendered painted_px=' boot.log || { echo 'FAIL #400: service loop never rendered a frame (render path dead)'; exit 1; }
          px=$(grep -oE 'painted_px=[0-9]+' boot.log | head -1 | grep -oE '[0-9]+'); test "${px:-0}" -gt 0 || { echo "FAIL #400: rendered frame is BLANK (painted_px=${px:-0}) -- screen draw produced nothing"; exit 1; }
          # #400 input + navigation: a scripted synthetic key sequence drives the
          # active screen's on_key -> ScreenAction -> apply_action -> navigation
          # path (real keypad decode is hardware-gated). A round trip
          # Home --Rsk--> Search --End--> Home proves input dispatch AND the
          # screen stack (back-navigation) work end-to-end, and the render
          # follows the active screen (a distinct painted_px for Search).
          grep -q 'kardia: nav Home -> Search' boot.log || { echo 'FAIL #400: synthetic input did not navigate Home->Search (input dispatch / on_key broken)'; exit 1; }
          grep -q 'kardia: nav Search -> Home' boot.log || { echo 'FAIL #400: back-navigation did not return to Home (screen stack broken)'; exit 1; }
          # #402 clock: the trust-hierarchy ClockManager is wired into the loop
          # (was zero production callers) + seeded Manual + drives the home-screen
          # display. Assert a real ~2025 epoch (not 0/1970), proving the wiring.
          grep -q 'kardia: clock src=manual' boot.log || { echo 'FAIL #402: ClockManager not wired/seeded (no manual source)'; exit 1; }
          wall=$(grep -oE 'clock src=manual wall=[0-9]+' boot.log | head -1 | grep -oE '[0-9]+$'); test "${wall:-0}" -gt 1700000000 || { echo "FAIL #402: wall clock is not a real epoch (wall=${wall:-0}) -- ClockManager not driving time"; exit 1; }
          # #398 telephony: a seeded mock modem transport backs a LIVE Telephony
          # stack (structurally impossible before -- zero production callers). The
          # full 10-step AT initialize() ran and the modem reached Registered,
          # proving the AT/call state machines are exercised in emulation without
          # real modem hardware (the CCCI wire protocol is hardware-gated).
          grep -q 'kardia: modem ready state=Registered' boot.log || { echo 'FAIL #398: Telephony did not initialize to Registered (AT state machine / mock wiring broken)'; exit 1; }
          # PL0 isolation + graceful user-fault kill (#487 + fault handling):
          # each probe variant attempts one PL0-illegal op. A correct kernel
          # (a) faults it -- 'hello' never prints, (b) KILLS only the faulting
          # process -- a USERFAULT marker names the kind, and (c) SURVIVES --
          # the service loop still reaches its tick cap and exits 0. Fails
          # closed on every axis: broken isolation runs the probe + prints hello
          # (red on hello-absent AND the missing marker); a handler that still
          # halts exits 2/3/4 != 0 (red); a kernel that dies after the kill
          # never prints ticks= (red). cp15 stays the linchpin: it SUCCEEDS at
          # PL1, so a broken mode-drop is a visible red, not a silent pass.
          # kread/kwrite: kernel 0x40008000 R/W -> data-abort; kexec: exec
          # kernel .text -> prefetch-abort; cp15: SCTLR read -> undefined-instruction.
          for probe in kread:data-abort kwrite:data-abort kexec:prefetch-abort cp15:undefined-instruction; do
            variant="${probe%%:*}"; kind="${probe##*:}"
            THUMOS_INIT_VARIANT="$variant" cargo build --release --target armv7a-none-eabi --features qemu --jobs 8
            prc=0
            THUMOS_INIT_VARIANT="$variant" THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee "probe-$variant.log" || prc=$?
            echo "=== isolation probe '$variant': runner rc=$prc (want 0: kernel survives the kill) ==="
            test "$prc" -eq 0 || { echo "FAIL isolation[$variant]: kernel did not survive the PL0 fault (rc=$prc; 2/3/4=halted-in-handler 5=loop-stall 1=panic 124=hang)"; exit 1; }
            grep -q '/init spawned PL0' "probe-$variant.log" || { echo "FAIL isolation[$variant]: /init did not spawn PL0 (cannot test isolation)"; exit 1; }
            grep -q "PROBE: $variant" "probe-$variant.log" || { echo "FAIL isolation[$variant]: the wrong probe variant was built (no 'PROBE: $variant' marker -- a cfg mixup)"; exit 1; }
            grep -Eq "USERFAULT: pid=[0-9]+ kind=$kind .*killed" "probe-$variant.log" || { echo "FAIL isolation[$variant]: no USERFAULT $kind kill marker -- PL0 op did not fault (ISOLATION BROKEN) or the kill path broke"; exit 1; }
            # Exactly ONE kill: a re-fault loop (kill path itself faulting) would
            # print the marker repeatedly. Exactly one proves a clean single kill.
            ufc=$(grep -c 'USERFAULT:' "probe-$variant.log")
            test "$ufc" -eq 1 || { echo "FAIL isolation[$variant]: expected exactly 1 USERFAULT, got $ufc (a re-fault loop or double kill)"; exit 1; }
            # The reaped half: PID 0 must reclaim the fault-killed PCB slot, else
            # the process table leaks and exhausts at MAX_PROCS over uptime.
            grep -q 'kardia: reaped .* fault-killed' "probe-$variant.log" || { echo "FAIL isolation[$variant]: fault-killed process was not reaped (PCB-slot leak -- table exhausts at MAX_PROCS)"; exit 1; }
            ! grep -q 'init: hello from userspace' "probe-$variant.log" || { echo "FAIL isolation[$variant]: /init reached the write -- the PL0 op did NOT fault (ISOLATION BROKEN)"; exit 1; }
            grep -q 'THUMOS-QEMU: service-loop ticks=' "probe-$variant.log" || { echo "FAIL isolation[$variant]: service loop never resumed after the kill (kernel did not survive)"; exit 1; }
          done
          echo "PL0 isolation + graceful kill + reap verified: every PL0-illegal op faults, the process is killed AND reaped, the kernel survives"
      - name: Kernel-fault halts (PL1 fault must NEVER be recovered)
        working-directory: crates/thumos
        # WHY: the other half of the safety property. A deliberate PL1 `udf`
        # after boot-complete must take the KERNEL branch: qemu exit 4, no
        # service-loop resume. If fault handling ever wrongly "recovers" a
        # kernel fault, the boot continues to ticks=/exit 0 and this reds.
        run: |
          set -uo pipefail
          cargo build --release --target armv7a-none-eabi --features qemu,kfault-probe --jobs 8
          krc=0
          THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee kfault.log || krc=$?
          echo "=== kernel-fault probe: runner rc=$krc (want 4) ==="
          test "$krc" -eq 4 || { echo "FAIL kfault: PL1 udf did not halt with exit 4 (rc=$krc) -- a kernel fault must NEVER be gracefully recovered"; exit 1; }
          grep -q 'KERNEL UNDEFINED INSTRUCTION' kfault.log || { echo 'FAIL kfault: missing kernel-fault banner'; exit 1; }
          ! grep -q 'THUMOS-QEMU: service-loop ticks=' kfault.log || { echo 'FAIL kfault: service loop ran past a KERNEL fault (fault was masked)'; exit 1; }
          ! grep -q 'USERFAULT:' kfault.log || { echo 'FAIL kfault: a PL1 fault took the USER kill branch (mode check broken)'; exit 1; }
      - name: Userspace sleep really yields (#477, no busy-wait deadlock)
        working-directory: crates/thumos
        # WHY: a userspace nanosleep/Sleep must YIELD (switch away, resume after
        # the interval), not busy-wait. The old busy-wait ran IRQ-masked in the
        # SVC trap, so ticks() froze and the WHOLE kernel hung. The sleep /init
        # variant sleeps 30ms between "sleeping" and "woke": a real yield lets
        # the service loop run meanwhile and /init resume ("woke" + exit 0); a
        # busy-wait hangs the kernel -> runner timeout (124), no "woke".
        run: |
          set -uo pipefail
          THUMOS_INIT_VARIANT=sleep cargo build --release --target armv7a-none-eabi --features qemu --jobs 8
          src=0
          THUMOS_INIT_VARIANT=sleep THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee sleep.log || src=$?
          echo "=== sleep probe: runner rc=$src (want 0) ==="
          test "$src" -eq 0 || { echo "FAIL sleep: kernel did not survive a userspace sleep (rc=$src; 124=hang -> busy-wait deadlock regression)"; exit 1; }
          grep -q 'init: sleeping' sleep.log || { echo 'FAIL sleep: /init did not reach the sleep'; exit 1; }
          grep -q 'init: woke' sleep.log || { echo 'FAIL sleep: /init never resumed from sleep (busy-wait deadlock or lost wake)'; exit 1; }
          grep -q 'THUMOS-QEMU: service-loop ticks=' sleep.log || { echo 'FAIL sleep: service loop did not run (kernel hung during the sleep)'; exit 1; }
      - name: QEMU fork correctness + isolation (#478)
        working-directory: crates/thumos
        # WHY: a PL0 fork must give the child its OWN deep-copied memory. /init
        # forks; the parent and child write DISTINCT markers (proving the r0
        # split -- child gets 0, parent gets the child pid -- and that the child
        # resumed at the fork return via the seeded trap frame); the child
        # mutates a stack canary + a .data canary and the parent then checks its
        # OWN copies are untouched (a shared-page fork leaks the mutation ->
        # 'isolation BROKEN' + likely parent corruption/USERFAULT); the child
        # exits(7) and the parent waitpids it (proving exit_cleanup freed the
        # CHILD's frames, not the parent's -- else the parent's stack faults).
        run: |
          set -uo pipefail
          THUMOS_INIT_VARIANT=fork cargo build --release --target armv7a-none-eabi --features qemu --jobs 8
          frc=0
          THUMOS_INIT_VARIANT=fork THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee fork.log || frc=$?
          echo "=== fork: runner rc=$frc (want 0) ==="
          test "$frc" -eq 0 || { echo "FAIL fork: kernel did not survive (rc=$frc; 124=hang 2/3/4=abort)"; exit 1; }
          grep -q 'init: fork parent' fork.log || { echo 'FAIL fork: no parent branch (fork did not return the child pid)'; exit 1; }
          grep -q 'init: fork child' fork.log || { echo 'FAIL fork: no child branch (child did not resume at the fork return with r0=0 -- the #478 ctx seed)'; exit 1; }
          grep -q 'init: fork isolation intact' fork.log || { echo 'FAIL fork: child writes reached the parent (SHARED PAGES -- deep copy broken)'; exit 1; }
          ! grep -q 'init: fork isolation BROKEN' fork.log || { echo 'FAIL fork: explicit isolation break'; exit 1; }
          ! grep -q 'init: fork FAILED' fork.log || { echo 'FAIL fork: fork returned an error'; exit 1; }
          ! grep -q 'USERFAULT:' fork.log || { echo 'FAIL fork: a process faulted (bad child frame, bad mapping, or parent stack freed by the child exit)'; exit 1; }
          grep -q 'init: hello from userspace' fork.log || { echo 'FAIL fork: parent did not continue past the harness'; exit 1; }
          grep -q 'THUMOS-QEMU: service-loop ticks=' fork.log || { echo 'FAIL fork: kernel did not survive'; exit 1; }
      - name: QEMU exec correctness + PL0 (#489)
        working-directory: crates/thumos
        # WHY: PL0 execve must REPLACE the caller's image with a new one that
        # runs at PL0. /init execs /init2: 'init: exec-ing /init2' (execve
        # called) then 'init2: reached via exec' (the NEW image's _start ran ->
        # exec succeeded, the live page table was remapped + ACTIVE_FRAME
        # installed, the #489 linchpin). /init2 then does a privileged cp15 read
        # that UNDEF-faults AT PL0 (kind=undefined-instruction, pid=1) -- proving
        # the exec'd image is unprivileged; 'init2: PRIVILEGED' would mean it ran
        # at PL1 (mode-drop broken). The OLD image is gone: no 'hello from
        # userspace' (the default /init tail) appears. The kernel survives the
        # fault (ticks). 'exec FAILED' = execve returned an error.
        run: |
          set -uo pipefail
          THUMOS_INIT_VARIANT=exec cargo build --release --target armv7a-none-eabi --features qemu --jobs 8
          erc=0
          THUMOS_INIT_VARIANT=exec THUMOS_QEMU_TIMEOUT=60 ../../scripts/qemu-runner.sh target/armv7a-none-eabi/release/thumos | tee exec.log || erc=$?
          echo "=== exec: runner rc=$erc (want 0) ==="
          test "$erc" -eq 0 || { echo "FAIL exec: kernel did not survive (rc=$erc; 124=hang 2/3=abort)"; exit 1; }
          grep -q 'init: exec-ing /init2' exec.log || { echo 'FAIL exec: /init never called execve'; exit 1; }
          grep -q 'init2: reached via exec' exec.log || { echo 'FAIL exec: the new image never ran (remap or ACTIVE_FRAME install broken -- exec did not transfer control)'; exit 1; }
          ! grep -q 'init: exec FAILED' exec.log || { echo 'FAIL exec: execve returned an error'; exit 1; }
          grep -Eq 'USERFAULT: pid=1 kind=undefined-instruction .*killed' exec.log || { echo 'FAIL exec: the exec-d image did not UNDEF on its cp15 probe (PL0 proof missing)'; exit 1; }
          ! grep -q 'init2: PRIVILEGED' exec.log || { echo 'FAIL exec: the exec-d image ran at PL1 (mode drop across exec broken -- SECURITY)'; exit 1; }
          ! grep -q 'init: hello from userspace' exec.log || { echo 'FAIL exec: the OLD image kept running after exec (control not transferred)'; exit 1; }
          grep -q 'THUMOS-QEMU: service-loop ticks=' exec.log || { echo 'FAIL exec: kernel did not survive the exec-d process fault'; exit 1; }
