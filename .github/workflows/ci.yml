# WHY: The real quality gate — rustfmt, clippy, and the full test suite for
# both the workspace crates (host) and the excluded bare-metal kernel binary
# (i686 host tests + armv7a cross-compile). Mirrors the local `kanon gate` and
# the stages in .kanon-ci.toml, with cargo concurrency pinned per CI.md.
#
# Kernel unit tests run on the 32-bit i686 target because the kernel's syscall
# ABI uses u32 addresses; a 64-bit host truncates real pointers and crashes.
# See AGENTS.md § Build. cargo-nextest is the canonical runner — its per-test
# process isolation is required by tests that touch the kernel's static-mut
# globals.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PROJECT: explicit top-level default deny; jobs read only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-only:
    # WHY (#775): this standalone fleet preflight is the sole implementation
    # of the docs-only verdict. Keeping it in this workflow makes the result
    # reachable by the required kernel job without serialising that job behind
    # the much longer gate-attestation workflow.
    uses: forkwright/.github/.github/workflows/docs-only.yml@bf948dfbfefa9b59c2d5f6b10b5eb0df3f24fb52 # main
    with:
      docs_only_exemption: true

  fmt:
    # WHY: fastest check first — a formatting miss fails in seconds without
    # spending build minutes. Covers both the workspace crates and the
    # bare-metal kernel crate (excluded from the workspace, so it needs its
    # own manifest-path invocation).
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # PROJECT: never expose the token to steps
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check
      # WHY: the kernel crate is excluded from the workspace, so --all misses it.
      - run: cargo fmt --manifest-path crates/thumos/Cargo.toml --check
      - name: Doc inventory check (#641)
        # WHY (#641): the crate roster (ARCHITECTURE.md's crate map table +
        # _llm/architecture.toml's [[architecture.crates]]) and the docs/
        # manifest are derived from Cargo.toml workspace members and
        # `find docs -type f` respectively -- this is the only thing that
        # checks the hand-restatements still agree with the source. Declared
        # as a `.kanon-ci.toml` stage since #642 but never invoked by this
        # workflow, so GitHub-hosted CI never ran it and drift merged
        # silently on green (eidolon-core missing from both docs, caught
        # only by a later audit). Placed here rather than in the `kernel`
        # job: it is source-level and cheap (no build/boot artifact
        # dependency, unlike the target-test-ledger and the kernel job's full
        # wiring-inventory check), so it belongs in the fastest job per this
        # file's own "fastest check first" rule rather than waiting behind
        # the kernel job's ~20-minute build+QEMU-witness chain for nothing.
        run: scripts/check-doc-inventory.sh
      - name: Capability-reachability source inventory check (#944)
        # WHY (#944): docs-only PRs skip the kernel job, so run the canonical
        # source checks here for every PR. The kernel path below still runs
        # the same checker with its boot-log assertion after QEMU boots.
        run: scripts/check-wiring-inventory.sh --no-log
      - name: Literal pin parity
        # WHY: crates/metaxu-core and crates/thumos cannot inherit every
        # dependency -- the first needs `default-features = false` (which
        # cargo refuses as a member override), the second is excluded from
        # the workspace entirely -- so both restate versions the workspace
        # also declares. metaxu-core's header asserts those match; it has
        # been false twice (ed25519-dalek 2 vs 3, compact_str 0.8 vs 0.10),
        # and two majors of one crate are two distinct types across a
        # boundary these crates exchange values over. Source-level and
        # cheap, so it rides in the fastest job like the check above.
        run: scripts/check-pin-parity.sh
      - name: LLM corpus issue refs
        # WHY: llms.txt points agents at _llm/current_state.toml for "phase,
        # blockers, and open threads", and that file is hand-maintained. Its
        # open-threads block named three issues and two of them (#461, #528)
        # had been closed for weeks. A machine-readable file reads as data
        # rather than prose, so a stale entry there is trusted harder than the
        # same claim in a paragraph. One API call per named issue.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-llm-issue-refs.sh

  workspace:
    # WHY: clippy (deny warnings) + the workspace test suite for all 21
    # workspace members (20 libraries plus the hypographe host tool).
    # Concurrency pinned to 8 per CI.md § kanon-ci caps.
    #
    # WHY --locked (#757): without it, a dependency-resolving step silently
    # regenerates Cargo.lock when a manifest and the committed lock disagree
    # -- the lock never fails, and whatever drifted in is never scanned by
    # cargo-audit/cargo-deny. --locked (not --frozen, which also forbids
    # network) turns that drift into a build failure instead.
    name: workspace clippy + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          cache: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: workspace
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --jobs 8 -- -D warnings
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version ^0.9
      - name: nextest
        run: cargo nextest run --workspace --locked --build-jobs 8 --test-threads 8
      - name: doctests
        # WHY: cargo nextest does not run doctests; this covers them (and is
        # the workspace's `cargo test` gate step).
        run: cargo test --doc --workspace --locked --jobs 8

  kernel:
    # WHY: the bare-metal kernel is excluded from the workspace, so its host
    # unit tests (i686, u32-faithful ABI) and its real-target cross-compile
    # (armv7a-none-eabi) need a dedicated job. The .cargo/config.toml inside
    # crates/thumos pins the armv7a target + linker script, so the build step
    # only needs to run from that directory. This job's name is also the
    # required branch-protection check, which is why the fuzz/ lockfile step
    # below rides along here (#768) rather than in a new job: a new job's
    # check name is not required until branch protection is updated
    # separately, and this job already has the toolchain fuzz/'s check needs.
    name: kernel (i686 tests + armv7a build)
    needs: docs-only
    # WHY (#775): a failed preflight leaves its output indeterminate. Run this
    # required job anyway so indeterminate means a full build, not a vacuous
    # success. A cancelled superseded workflow does not need to keep building.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # WHY 60m: warm p95 is already 26m of 30m (measured across six runs); a
    # cold cache puts the cross-compile past the budget (kanon#10081 audit).
    timeout-minutes: 60
    env:
      # WHY: even a literal true is not trusted from a failed reusable job
      # (for example, a post-job failure after the output was written). Every
      # combination except success + literal true takes the full build path.
      DOCS_ONLY: ${{ needs.docs-only.result == 'success' && needs.docs-only.outputs.docs_only == 'true' }}
    steps:
      - name: Report docs-only kernel exemption (#775)
        if: env.DOCS_ONLY == 'true'
        # WHY: the required check context must still report. Every build and
        # witness step below runs unless the shared preflight says literal true.
        run: echo "Shared preflight classified this changeset as docs-only; kernel build and witnesses skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOCS_ONLY != 'true'
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        if: env.DOCS_ONLY != 'true'
        with:
          target: i686-unknown-linux-gnu, armv7a-none-eabi
          cache: false
          # WHY rustflags is emptied HERE and nowhere else (#546): this action
          # exports RUSTFLAGS="-D warnings" by default, and an env RUSTFLAGS
          # REPLACES the rustflags in crates/thumos/.cargo/config.toml rather
          # than merging with them — dropping `-C link-arg=-Tlink.ld` and the
          # -D warnings gate (#431) the config owns. Every step in this job runs
          # cargo against the kernel crate, whose flags are config-owned; the
          # other jobs build the root workspace, which declares no config
          # rustflags, so there `-D warnings` is the only source and is wanted.
          # Empty means UNSET, not set-to-empty: the action skips the export
          # entirely, and cargo treats a set-but-empty RUSTFLAGS as an override
          # to nothing, which would clobber just the same.
          rustflags: ""
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: env.DOCS_ONLY != 'true'
        with:
          key: kernel
          workspaces: crates/thumos
      - name: Install 32-bit link support
        if: env.DOCS_ONLY != 'true'
        # WHY: linking the i686 test binary needs the multilib crt objects.
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Install cargo-nextest
        if: env.DOCS_ONLY != 'true'
        run: cargo install cargo-nextest --locked --version ^0.9
      - name: Kernel host tests (i686)
        if: env.DOCS_ONLY != 'true'
        # WHY (#546): canonical script shared with the forge admission gate —
        # both surfaces execute the identical suite.
        run: scripts/kernel-host-tests.sh
      - name: Target-test ledger check (#551)
        if: env.DOCS_ONLY != 'true'
        # WHY (#551, restoring #124; #645): declared-vs-executed must be
        # auditable — reds when a test-bearing or target-sensitive module has
        # no ledger row, a witness name rots, a sensitive host-only row loses
        # its fidelity label, or a declared tests count drifts from the
        # RUNNABLE set `cargo nextest list` reports (#645: a module cfg'd out
        # of the test build contributes zero regardless of its source text).
        # Needs a build, but the "Kernel host tests" step just above already
        # built this exact i686 target, so this is a cache hit, not a
        # separate compile — placement in the job matters.
        run: scripts/check-target-test-ledger.sh
      - name: Crypto zeroize feature check (#835/#836)
        if: env.DOCS_ONLY != 'true'
        # WHY: the `zeroize` feature on a keyed crypto crate has no
        # behavioural signature -- without it everything compiles and runs
        # identically and the AES round-key schedule is left resident after
        # use. No test fails and no warning fires, so a crate added with a
        # bare `aes = "0.9"` regresses the guarantee silently. Reads the
        # manifests rather than the resolved graph, because `cargo metadata`'s
        # resolve over-approximates what any one build enables. Cheap,
        # source-level, no toolchain beyond python3.
        run: scripts/check-crypto-zeroize-features.sh
      - name: Board-seam invariant check (#534)
        if: env.DOCS_ONLY != 'true'
        # WHY: #534 makes the two-board reality structural, not prose — reds
        # on any MT6739_* identifier outside board::m7, any board-MMIO value
        # re-declared as a const outside board/, or known exact-form PWRAP/
        # legacy CPU-power spellings and common two-literal expressions before
        # #862/#879 land. Cheap, source-level.
        run: scripts/check-board-seam.sh
      - name: Convergence ratchet check (#545)
        if: env.DOCS_ONLY != 'true'
        # WHY (#545): kernel↔workspace duplication only ever burns down —
        # reds on an unclassified pair, a rising port-marker count, or a
        # stale #126 pointer. Cheap, source-level.
        run: scripts/check-convergence.sh
      - name: Kernel lockfile version drift (#688)
        if: env.DOCS_ONLY != 'true'
        # WHY (#688): crates/thumos is excluded from the workspace and keeps its
        # own lockfile. release-please updates it via an explicit selector that
        # once named a single crate by hand, so six first-party versions sat
        # three releases behind while cargo rewrote the file underfoot on every
        # build. An enumeration of things that grow goes stale quietly.
        run: scripts/check-external-lockfile-versions.sh crates/thumos/Cargo.lock
      - name: Fuzz lockfile version drift (#768)
        if: env.DOCS_ONLY != 'true'
        # WHY (#768): fuzz/ is a THIRD standalone lockfile (its own
        # `[workspace]`, excluded from both the root workspace and
        # crates/thumos) parked in this job for the same reason the kernel
        # check above is — it needs no toolchain beyond what this job already
        # sets up, and this job is the one required check both non-workspace
        # graphs can piggyback on. It carries no kernel-specific meaning.
        # cargo-fuzz's own CLI has no --locked flag to forward (checked:
        # `cargo fuzz run --help` against 0.13.2), so this step, not a fuzz.yml
        # change, is what makes fuzz/Cargo.lock drift fail a PR instead of
        # only being caught (if at all) by the weekly fuzz.yml run against an
        # ephemeral runner that never commits the drift back.
        run: scripts/check-external-lockfile-versions.sh fuzz/Cargo.lock
      - name: Fuzz target coverage check (#819)
        if: env.DOCS_ONLY != 'true'
        # WHY (#819): the WPA, EAPOL and CCCI targets fuzz implementations the
        # kernel does not link, so the shipped radio and modem-boundary parsers
        # have no fuzz coverage while a green run reads as though they do. Graded
        # per module, because one crate can have both a module that delegates
        # into the shared core and one that does not. Fails on any gap not listed
        # with its cause, and on any listed gap that has since been closed.
        run: scripts/check-fuzz-target-coverage.sh
      - name: Kernel build entrypoint check (#546)
        if: env.DOCS_ONLY != 'true'
        # WHY it runs BEFORE the build: it is a source-level grep that names the
        # CAUSE of the failure the next steps would otherwise report as
        # undefined linker symbols. A kernel build that inherits an env
        # RUSTFLAGS loses the link script and the warning gate together, and
        # only the link loss is loud.
        run: scripts/check-kernel-build-entrypoint.sh
      - name: Kernel cross-compile (armv7a) + zero-warning gate (#431)
        if: env.DOCS_ONLY != 'true'
        # WHY (#431): the zero-warning gate lives in crates/thumos/.cargo/
        # config.toml's rustflags; scripts/kernel-build.sh builds through it
        # and never lets an env RUSTFLAGS clobber it (#546).
        run: scripts/kernel-build.sh
      - name: Kernel image window + headroom (#917)
        if: env.DOCS_ONLY != 'true'
        # WHY here rather than with the cheap source checks: it runs the drift
        # check either way, but placed AFTER the cross-compile it can also read
        # __svc_stack_top out of the ELF and report how much of the window is
        # left. link.ld's ASSERT is a cliff -- silent at 99%, a build failure at
        # 101% -- so the number is the only warning anyone gets.
        run: scripts/check-kernel-window.sh
      - name: Trust-anchor build guard (#233)
        if: env.DOCS_ONLY != 'true'
        # WHY (#233): production must FAIL keyless, REFUSE the dev key, and
        # BUILD with a real (ephemeral) key — the script carries the 3-part check.
        run: scripts/witness/trust-anchor.sh
      - name: Install qemu-system-arm
        if: env.DOCS_ONLY != 'true'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Kernel QEMU boot + service loop (real kinit -> boot-complete -> loop)
        if: env.DOCS_ONLY != 'true'
        # WHY: the REAL kinit under qemu-system-arm, the kardia service loop,
        # and the four PL0 isolation probes. Assertions live ONLY in the
        # script (#546); runner exit codes: 0=loop ran; 5=loop-stall (#461);
        # 1=panic; 2/3/4=aborts; 124=hang.
        run: scripts/witness/boot.sh
      - name: Capability-reachability inventory check (#550)
        if: env.DOCS_ONLY != 'true'
        # WHY (#550): the inventory is the SSOT for what is wired; reds when a
        # module is unclassified, a witness is claimed but not asserted, or an
        # asserted witness did not fire in the boot.log just produced above.
        run: scripts/check-wiring-inventory.sh
      - name: Kernel-fault halts (PL1 fault must NEVER be recovered)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/kfault.sh
      - name: Fault-contained syscall copyin/copyout (#871)
        if: env.DOCS_ONLY != 'true'
        # Real caller-VAS permission matrix plus raw post-validation
        # LDRBT/STRBT faults; kfault immediately above is the negative control.
        run: scripts/witness/uaccess.sh
      - name: Userspace sleep really yields (#477, no busy-wait deadlock)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/sleep.sh
      - name: QEMU fork correctness + isolation (#478)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/fork.sh
      - name: QEMU exec correctness + PL0 (#489)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/exec.sh
      - name: QEMU fork+exec composes -- per-process images (#502)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/forkexec.sh
      - name: QEMU PROT_NONE guard pages survive fork (#496)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/guard.sh
      - name: QEMU brk heap growth on a real page table (#533)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/brk.sh
      - name: QEMU userspace signal delivery + sigreturn (#446)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/signal.sh
      - name: QEMU PID-0 fault supervisor + crash-loop rate limit (#492)
        if: env.DOCS_ONLY != 'true'
        run: scripts/witness/crashloop.sh
      - name: Authenticated Aletheia round trip over the second UART (#544)
        if: env.DOCS_ONLY != 'true'
        # WHY (#544 on-device leg): a real Thumos userspace process
        # (/metaxu_probe) drives a metaxu-core authenticated request over
        # board::UART1_BASE to a real host pylon-bridge process and back --
        # the SAME reference endpoint the crates/metaxu adversarial witness
        # runs against, not a second implementation.
        run: scripts/witness/metaxu.sh
      - name: Authenticated Aletheia round trip -- negative cases (#544)
        if: env.DOCS_ONLY != 'true'
        # WHY (#544 negative-case witness): metaxu.sh proves only the happy
        # path, which passes against a bridge that accepts anything. Three
        # distinct typed outcomes: a tampered response reaches MAC_FAILED,
        # an expired grant is denied locally, and a capability absent from
        # the grant is denied locally with NOTHING transmitted to the host
        # bridge.
        run: scripts/witness/metaxu-negative.sh
      - name: Witness-extraction drift guard (#546)
        if: env.DOCS_ONLY != 'true'
        # WHY (#546): reds if witness assertions ever re-inline into a CI
        # surface or a stage stops calling the canonical scripts.
        run: scripts/check-witness-extraction.sh
      - name: Kernel clippy (i686) -- zero-warning gate (#663)
        if: env.DOCS_ONLY != 'true'
        # WHY (#663): the kernel crate is excluded from the workspace, so no
        # --workspace clippy invocation in the repo ever reaches crates/thumos.
        #
        # WHY LAST rather than beside the i686 tests that warm its cache: a
        # failing step aborts the job, and every check below it would stop
        # running. While #672's backlog is open this step is known-red, so
        # placing it earlier would silently disable the ledger, board-seam,
        # convergence, armv7a cross-compile, trust-anchor and QEMU witness
        # gates — trading six working gates for one new one. It costs a
        # recompile here; that is the correct price.
        run: scripts/kernel-clippy.sh
