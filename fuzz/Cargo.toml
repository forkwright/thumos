[workspace]

[package]
name = "peirama"
version = "0.9.1"
publish = false
edition = "2024"
# WHY: cargo-fuzz requires nightly; this crate is never published.
# WHY: first-party test crate takes the repo license (root workspace is
# PolyForm Shield); cargo-deny warns on a missing license field (#547).
license = "LicenseRef-PolyForm-Shield-1.0.0"
# WHY this tracks the workspace release version, not a fixed 0.0.0 (#768):
# release-please-config.json's fuzz/Cargo.lock selector is a bare
# `!@.source` existence filter (a `@.name`-equality exclusion for this
# crate does not work -- see the note in CONTRIBUTING.md's Releases
# section) and so unconditionally sweeps this package's own Cargo.lock
# entry to the release version too. Pinning this field lets that lock
# entry stay self-consistent instead of drifting from it every release.

[[bin]]
name = "fuzz_eapol"
path = "fuzz_targets/fuzz_eapol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gsm7"
path = "fuzz_targets/fuzz_gsm7.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns"
path = "fuzz_targets/fuzz_dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_at"
path = "fuzz_targets/fuzz_at.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ccci"
path = "fuzz_targets/fuzz_ccci.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pdu"
path = "fuzz_targets/fuzz_pdu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wpa"
path = "fuzz_targets/fuzz_wpa.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_packet"
path = "fuzz_targets/fuzz_packet.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
aither = { path = "../crates/aither" }
klesis = { path = "../crates/klesis" }
asphaleia = { path = "../crates/asphaleia" }

[profile.release]
# WHY: sanitiser instrumentation and coverage tracking require debug info.
debug = true

[profile.dev]
# WHY: consistent with workspace dev profile used by cargo check.
opt-level = 1

[package.metadata]
# WHY: required marker so `cargo fuzz list` recognises this as a fuzz project.
cargo-fuzz = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-27"
exit-criteria = "operator-reviewed hardware validation and release-readiness gate"
