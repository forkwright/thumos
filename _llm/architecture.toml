[meta]
name = "thumos"
repo = "forkwright/thumos"
generated = false
source_docs = [
  "README.md",
  "ARCHITECTURE.md",
  "CLAUDE.md",
  "<canonical-state-doc>/STATE.md",
  "_llm/README.md",
]

[architecture]
summary = "Rust mobile OS for the AGM M7: one bare-metal kernel plus userspace crates for input, radios, telephony, security, crypto, UI, and radio tools."
layers = [
  "kernel",
  "input",
  "security",
  "radio",
  "telephony",
  "crypto",
  "radio-tools",
  "ui",
  "hardware-reference",
]

[[architecture.crates]]
name = "thumos"
path = "crates/thumos"
role = "Bare-metal ARM kernel for MMU, scheduler, IPC, VFS, network, crypto, telephony, audio, and UI framework."

[[architecture.crates]]
name = "haphe"
path = "crates/haphe"
role = "GPIO keypad, touchscreen, T9 input routing, and event queue."

[[architecture.crates]]
name = "asphaleia"
path = "crates/asphaleia"
role = "Packet filter firewall, DNS blocklist, capability enforcement, and packet parsing."

[[architecture.crates]]
name = "asphaleia-core"
path = "crates/asphaleia-core"
role = "Canonical IPv4/TCP/UDP parse + DNS blocklist semantics; no_std, consumed by both the kernel firewall and asphaleia so the two cannot drift (#545)."

[[architecture.crates]]
name = "stegnos"
path = "crates/stegnos"
role = "Encrypted storage and secure erase."

[[architecture.crates]]
name = "leipsanon"
path = "crates/leipsanon"
role = "Panic mode triggers, wipe ordering, and memory scrubbing."

[[architecture.crates]]
name = "aither"
path = "crates/aither"
role = "WiFi MAC driver, MAC randomization, scanning, and WPA supplicant behavior."

[[architecture.crates]]
name = "aither-core"
path = "crates/aither-core"
role = "Canonical EAPOL frame parse/encode, PMK/PTK/MIC derivation, and the WPA2 4-way handshake state machine; no_std, consumed by both the kernel WiFi path and aither so the two cannot drift, and so the fuzz targets reach shipped code (#545, #819)."

[[architecture.crates]]
name = "pteron"
path = "crates/pteron"
role = "Bluetooth HCI and LE Privacy behavior."

[[architecture.crates]]
name = "kelyphos"
path = "crates/kelyphos"
role = "CONSYS/WMT combo chip manager."

[[architecture.crates]]
name = "topos"
path = "crates/topos"
role = "GPS NMEA parsing, geofencing, and position logging."

[[architecture.crates]]
name = "topos-core"
path = "crates/topos-core"
role = "Canonical NMEA checksum framing, coordinate/fix-quality semantics, and GGA/RMC sentence parsing; no_std, consumed by both the kernel GPS driver and topos so the two cannot drift (#545)."

[[architecture.crates]]
name = "klesis"
path = "crates/klesis"
role = "AT command parser, CCCI/CLDMA framing, SMS PDU, and GSM-7."

[[architecture.crates]]
name = "klesis-core"
path = "crates/klesis-core"
role = "Canonical GSM-7 codec, SMS-PDU byte primitives, and silent-SMS/WAP-Push classification; no_std, consumed by both the kernel SMS path and klesis so the two cannot drift (#545, #662)."

[[architecture.crates]]
name = "krypta"
path = "crates/krypta"
role = "X3DH key exchange, directional symmetric chain ratchets (NOT the Signal Double Ratchet — no DH ratchet, #543), session management."

[[architecture.crates]]
name = "sema"
path = "crates/sema"
role = "Radio analysis, WiFi/BT/cell scanning, IMSI-catcher and rogue-AP detection."

[[architecture.crates]]
name = "eidolon"
path = "crates/eidolon"
role = "Framebuffer UI, widgets, status bar, dialer, and T9 rendering."

[[architecture.crates]]
name = "eidolon-core"
path = "crates/eidolon-core"
role = "no_std display layout geometry: screen size and the three zone heights (status bar, content, softkey bar); consumed by both eidolon and the kernel's ui.rs so the two cannot drift (#740, #545)."

[[architecture.crates]]
name = "sema-core"
path = "crates/sema-core"
role = "no_std+alloc threat-semantics core: canonical ThreatLevel/Calibration types shared by sema and the kernel."

[[architecture.crates]]
name = "metaxu"
path = "crates/metaxu"
role = "Aletheia/Thumos thin-client bridge protocol: typed tasks, capability grant claims, and opaque identity references."

[[architecture.crates]]
name = "metaxu-core"
path = "crates/metaxu-core"
role = "no_std+alloc envelope framing, signed-grant verification, and typed task/response payloads; consumed by both metaxu and the kernel's metaxu_bridge.rs so the wire format cannot drift (#544, #545)."

[[architecture.crates]]
name = "hypographe"
path = "crates/hypographe"
role = "Boot-image signing tool: streamed Ed25519ph signer for the kernel boot gate's payload/signature layout."

[[interfaces]]
name = "thumos kernel"
kind = "kernel"
path = "crates/thumos"
