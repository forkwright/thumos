[meta]
name = "thumos"
repo = "forkwright/thumos"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "<canonical-state-doc>/STATE.md",
  "_llm/decisions.toml",
]

[decisions]
summary = "Core decisions for the thumos mobile OS."

[[decision]]
id = "D-full-rust"
title = "Full Rust from kernel to UI"
status = "accepted"
context = "The stock Android/Linux stack and BSP blobs are unauditable for the threat model."
decision = "Author no C and replace Linux/Android with a Rust kernel and userspace."
consequences = "Hardware bring-up is harder, but the audit boundary is controlled."

[[decision]]
id = "D-monolithic-kernel"
title = "Use a monolithic kernel on AGM M7"
status = "accepted"
context = "The target has 4 Cortex-A53 cores at 1.5GHz and 1GB RAM."
decision = "Use a monolithic Rust kernel rather than a microkernel."
consequences = "IPC overhead stays low; clean crate boundaries preserve future split options on larger hardware."

[[decision]]
id = "D-armv7-target"
title = "Target 32-bit armv7"
status = "accepted"
context = "MT6739 is 64-bit capable, but stock firmware and bootloader expect a 32-bit image."
decision = "Build the kernel for armv7a-none-eabi and userspace for armv7 Linux musleabihf where applicable."
consequences = "Boot compatibility takes precedence over theoretical 64-bit capability."

[[decision]]
id = "D-modem-hostile"
title = "Treat modem as hostile"
status = "accepted"
context = "The modem is a separate processor with binary firmware."
decision = "Firewall CCCI at the kernel boundary, filter IMEI/IMSI, and log modem identity transmissions."
consequences = "Modem access is capability-gated and auditable."

[[decision]]
id = "D-device-identity"
title = "Enforce identity protection in drivers"
status = "accepted"
context = "Userspace spoofing can be bypassed by compromised components."
decision = "Randomize WiFi MAC per connection, rotate BT LE Privacy addresses, passively scan by default, and log identity transmissions."
consequences = "RF fingerprint remains an accepted M7 hardware risk, but software identifiers are protected at lower layers."
