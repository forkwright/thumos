[meta]
name = "thumos"
repo = "forkwright/thumos"
generated = false
source_docs = [
  "README.md",
  "CLAUDE.md",
  "<canonical-state-doc>/STATE.md",
]

[decisions]
summary = "Core decisions for the thumos mobile OS."

[[decision]]
id = "D-full-rust"
title = "Full Rust from kernel to UI"
status = "accepted"
context = "The stock Android/Linux stack and BSP blobs are unauditable for the threat model."
decision = "Author no C and replace Linux/Android with a Rust kernel, embedded programs, and Rust domain libraries."
consequences = "Hardware bring-up is harder, but the audit boundary is controlled."

[[decision]]
id = "D-monolithic-kernel"
title = "Use a monolithic kernel on AGM M7"
status = "accepted"
context = "The target has 4 Cortex-A53 cores at 1.5GHz and 1GB RAM."
decision = "Use a monolithic Rust kernel rather than a microkernel."
consequences = "IPC overhead stays low; clean crate boundaries preserve future split options on larger hardware."

[[decision]]
id = "D-armv7-target"
title = "Target 32-bit armv7"
status = "accepted"
context = "MT6739 is 64-bit capable, but the stock firmware and bootloader expect a 32-bit image."
decision = "Build the kernel and rustc-direct embedded programs for armv7a-none-eabi; workspace libraries and host tools do not imply a Linux runtime target."
consequences = "Boot compatibility takes precedence over theoretical 64-bit capability."

[[decision]]
id = "D-modem-hostile"
title = "Treat modem as hostile"
status = "accepted"
context = "The modem is a separate processor with binary firmware."
decision = "Firewall instrumented CCCI endpoints and constrain/audit AP-visible IMEI/IMSI access where the pinned protocol exposes it."
consequences = "The AP-visible CCCI path is capability-gated; modem-to-SIM, modem-to-radio, and uninstrumented shared-memory traffic remain outside that evidence boundary."

[[decision]]
id = "D-device-identity"
title = "Enforce identity protection in drivers"
status = "accepted"
context = "Userspace spoofing can be bypassed by compromised components."
decision = "Require a randomized WiFi MAC, BLE-only private-address rotation, passive WiFi scanning, and explicit treatment of Classic BT and AP-visible modem identity."
consequences = "Policy and host logic exist, but production WiFi/BT application remains #129 software work; RF, Classic BT, modem-to-SIM, and modem-to-radio identity remain explicit boundaries."
