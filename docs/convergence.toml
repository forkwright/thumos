[[pair]]
name = "ui"
kernel = "ui.rs, screen_dialer.rs (font behavior, dialer rendering ported from eidolon/haphe)"
workspace = "eidolon, haphe"
disposition = "extract-core"
canonical = "eidolon-core for display layout geometry (#740) and the 8x16 bitmap font table + CHAR_WIDTH/CHAR_HEIGHT/FONT_FIRST/FONT_LAST/FONT_CHAR_COUNT (#545); colour type and drawing-primitive/widget core still pending"
owner = "unscheduled"
notes = "Live 'ported from' comment: screen_dialer.rs:11. eidolon -> haphe is the one real internal edge; the kernel consumes neither today. ui::Key vs haphe::input::Key (#615): the digit/star/hash/d-pad prefix (0-15) is genuine shared vocabulary, pinned by ui::tests::shared_prefix_discriminants_match_haphe against the real haphe crate; the extended range (16-21) is two independent button sets that happen to share a numeric range and is deliberately NOT asserted equal. Converged (#545, this slice): FONT_DATA (95 glyphs, verified byte-identical between ui.rs and eidolon/src/font.rs before the move -- the only prior difference was a `pub(crate)` visibility modifier) and its five dimension constants. Both sides now alias eidolon_core's copy via the same const-derivation pattern #740 established for the layout constants, never `pub(crate) use`: the kernel's nine feature configurations turn an unused re-export's `unused_imports` into a build failure that the crate-level `dead_code` expectation in main.rs does not cover. Also corrected three doc comments that had survived #731/#732 claiming eidolon or haphe 'cannot be linked' into the `#![no_std]` kernel because of a `std` dependency -- both crates have been `#![no_std]` since #732 (eidolon) and their first commit (haphe), and the kernel already path-links eidolon-core (and haphe as a dev-dependency, #615); the real reasons the colour type and ui::Key stay duplicated are unrelated to std and are unaffected by this slice (see below). NOT converged, deliberately: the colour type (Rgb565 lives in `eidolon`, which the kernel does not link -- only `eidolon-core` -- and converging it would ripple across ~19 kernel call sites that pass a raw u16 fg/bg); set_pixel/draw_char/draw_str/draw_char_scaled and ui.rs's test module (owned by a parallel lane fixing a live defect in the drawing primitives, #760); and ui::Key (vocabulary divergence above discriminant 15, as above)."

