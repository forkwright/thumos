[[pair]]
name = "keypad-matrix-scan"
kernel = "keypad.rs (mirrors haphe's scan/debounce algorithm, #446)"
workspace = "haphe (gpio.rs)"
disposition = "kernel-owned"
canonical = "keypad.rs's BootKeypad is the only consumed matrix-scan/debounce implementation; haphe::gpio's GpioKeypad/Debounce/KeyMatrix are pub(crate) and reached only by their own test module, so the duplicate has no consumer to converge with"
owner = "#545 (this PR)"
notes = "The event models genuinely differ: BootKeypad::poll_with_matrix (keypad.rs) returns Option<Key>, the first confirmed press only, no queue, no release/held -- it runs before interrupts, the heap, or the real KPD hardware block exist. GpioKeypad::process_matrix (haphe/gpio.rs) pushes InputEvent::Key { key, state: Pressed | Released } into a 64-slot InputQueue for a running input loop. But no second consumer exists to justify lifting a shared core: GpioKeypad/Debounce/KeyMatrix/gpio_reg/read_matrix are pub(crate), unreachable outside haphe, and called only from gpio.rs's own tests -- eidolon, haphe's one real external consumer, imports haphe::input::{Key, TouchPoint} and never touches haphe::gpio. Pin assignments are shared placeholders pending AGM M7 schematic verification either way. haphe has been #![no_std] with zero dependencies since its first commit and crates/thumos/Cargo.toml already path-links it as a dev-dependency for host tests (#615) -- \"cannot link a std crate\" is not the real reason keypad.rs stays independent; visibility and the differing event shape are. The workspace matrix-scan code is a deletion candidate under this disposition's own rule (the duplicate deletes when its consumers are gone) whenever a real second consumer is decided against; it is kept here only because deleting it is outside this ledger decision's scope."

[[pair]]
name = "gps"
kernel = "gps.rs (checksum framing, coordinate/fix-quality, GGA/RMC parsing converged)"
workspace = "topos"
disposition = "converged"
canonical = "topos-core (no_std+alloc; kernel links via path dep, topos re-exports FixQuality and converts Position/Fix)"
owner = "#545 (this PR)"
notes = "Converged: $...*XX checksum framing, ddmm.mmmm coordinate conversion, FixQuality, and full GGA/RMC sentence parsing. Five divergences found and resolved on the way -- (1) topos's checksum parser accepted a checksum field with only one hex digit (a width-flexible hex reader validated a truncated sentence missing its leading zero); the kernel required exactly two and topos now does too. (2) the kernel widened a parsed GGA quality byte via a truncating `as u8` cast, so a quality field of 264 wrapped to 8 (a DEFINED code) instead of being rejected; converged onto a saturate-to-default parse. (3) the kernel's fixed-point coordinate parser rejected minutes >= 60 and guarded an unbounded fractional-digit exponent; topos's f64 parser did neither -- both now share the guarded parser. (4) neither side bounded latitude to +/-90 or longitude to +/-180; both now do. (5) the kernel's altitude parser had no sign handling and silently swallowed a legitimate below-sea-level reading; topos's f64 parser handled it correctly and the kernel now does too. Also found: topos's RMC parser never extracted time/date at all (no prior implementation to compare against; both sides now share it, with range validation on hour/minute/second/month/day that neither side had, since clock.rs treats GPS as its highest-trust automatic time source); and topos's own `parse_gga_returns_error_when_no_fix` test carried a hardcoded checksum that did not match its body text, so it passed for the wrong reason (exercising the checksum-mismatch path, not the no-fix path it claimed to cover) -- fixed to compute the checksum. NOT converged: the WMT/CCCI hardware transport (SentenceBuffer, GpsHwOps, GpsHw) and the SentenceBuffer/GpsReceiver lifecycle state machine, which are genuinely kernel-device-specific; topos's own HDOP/speed/course extraction, which is plain `str::parse` with no NMEA-specific invariant worth sharing and which the kernel never reads."

[[pair]]
name = "wifi"
kernel = "wifi.rs (EAPOL/WPA2 delegated to aither-core; scan/association state machine still kernel-local)"
workspace = "aither"
disposition = "extract-core"
canonical = "aither-core (EAPOL frame types/parse/encode, PMK/PTK derivation, MIC, and the supplicant-side 4-way handshake state machine); scan/association state machine still pending"
owner = "#545, #819, #837"
notes = "Converged (#819): EapolType/KeyInfo/EapolKeyFrame/EapolFrame, eapol::parse/encode, PMK/PTK derivation (derive_pmk/derive_ptk), MIC (compute_mic/verify_mic), and the supplicant-side 4-way handshake state machine (HandshakeState/WpaHandshake -- previously kernel-only, fuzzed nowhere) all moved into aither-core; the kernel's own hand-rolled SHA-1/HMAC-SHA1/PBKDF2-HMAC-SHA1/PRF-384 (security.rs) is deleted in favor of the audited RustCrypto sha1/hmac/pbkdf2 crates aither-core uses, the same backend metaxu-core already proved in this kernel. Two live divergences were found and resolved on the way: aither's pre-convergence eapol::parse accepted any EAPOL-Key descriptor-type byte unchecked, where the kernel rejected anything but RSN (0x02) -- aither-core now enforces the kernel's gate, so fuzz_eapol/fuzz_wpa (which import aither, now delegating) reach code that actually ships; and aither's pre-convergence eapol::encode declared a truncated body_len/key_data_length field for an oversized input but wrote the full untruncated bytes anyway -- the same class of bug the kernel's own audit #282 finding 5 had already fixed on its side, which never reached aither. Also resolved (#837): the kernel's PBKDF2-HMAC-SHA1 PMK derivation truncated an over-32-byte SSID salt to 32 bytes before hashing (`salt.len().min(32)`), silently deriving a different PMK than a compliant supplicant would for the same passphrase/SSID pair; the audited pbkdf2 crate's salt handling has no such cap. WpaHandshake::process_message no longer draws its own SNonce via CSPRNG internally -- aither-core is no_std and cannot link the kernel's hardware-bound, fail-closed CSPRNG, so the caller (wifi.rs::generate_snonce) draws it and passes it in. NOT converged, deliberately: WifiConfig/ScanResult (fixed-array kernel storage), WifiHwOps/WifiHw/MockWifiHw/WifiDriver (MMIO hardware), generate_random_mac (CSPRNG-bound), and aither's own mac.rs/network.rs driver glue -- the scan/association half of this pair, unrelated to the EAPOL/WPA half this slice converged."

