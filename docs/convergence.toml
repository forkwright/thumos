[[pair]]
name = "telephony-sms"
kernel = "telephony.rs, telephony_parser.rs, sms.rs, sim.rs (CCCI/CLDMA transport, +CREG's <lac>/<ci> vs <AcT> composite shapes, +CMTI/+COPS/+CPIN/+CPINR, and SMS BCD address framing stay kernel-local)"
workspace = "klesis"
disposition = "converged"
canonical = "klesis-core (GSM-7 codec, PDU byte primitives, surveillance classification; RegStatus; AT final-result/RING token exactness, +CSQ extraction, dial-string charset, and dBm/bars signal conversion)"
owner = "#545 (this PR)"
notes = "Converged (#662): the GSM-7 tables and codec, hex/BCD/cursor primitives, and the silent-SMS + WAP-Push classification. The kernel's duplicate gsm7.rs is deleted. Two live divergences were found and resolved on the way -- the kernel discarded the PID entirely, so silent SMS was detected only in the layer that never runs; and the kernel accepted GSM-7 data ending on a dangling ESC that klesis rejected. Converged (#545, this PR): RegStatus and its From<u8> table; the OK/ERROR/RING exact-token classifier and +CME ERROR:/+CMS ERROR: numeric-code extraction (#685); +CSQ rssi/ber extraction; the dial-string charset (is_valid_dial_byte, shared by klesis's outbound validate_phone_number and the kernel's inbound +CLIP validation); and the RSSI-to-dBm/dBm-to-bars signal conversion, previously kept in sync only by a comment (sim.rs carried a THIRD independent copy of the RSSI-to-dBm formula, outside this pair's named files but the same primitive -- also converged onto klesis_core rather than left as a newly-more-visible stale duplicate). One divergence found and resolved on the way: klesis's parser rejected a CME/CMS error body that was not cleanly numeric (`+CME ERROR: 10x`, or verbose AT+CMEE=2 text) outright, where the kernel already classified it as a generic error (finding 13) -- rejecting left klesis's own response loop treating the line as informational and looping for a final result that would never arrive, the same silent-timeout hazard finding 13 fixed on the kernel side. klesis now inherits the kernel's (already-tested) behavior. NOT converged, by design: +CREG's composite URC shape (klesis needs `<lac>`/`<ci>`; the kernel needs `<AcT>`; the shared code table is RegStatus, already converged); +CMTI, +COPS, +CPIN, +CPINR, which exist on only one side; the CCCI/CLDMA hardware transport; and sms.rs's BCD address framing (unchanged from #662). Deliberately untouched: the `+CPIN?` SIM PIN/PUK prefix-match defect (#696, telephony_parser.rs and the duplicate at sim.rs:464) -- this pair's convergence does not reach that code, and #696 is tracked and fixed separately so a behavior change never hides inside a refactor."

