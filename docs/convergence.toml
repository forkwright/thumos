workspace = "asphaleia"
disposition = "extract-core"
canonical = "asphaleia-core (DNS QNAME extraction, blocklist policy + suffix rule); packet-parse core still pending"
owner = "unscheduled"
notes = "Converged (#661 workspace side, #662 kernel side): SURVEILLANCE_DOMAINS, domain_matches_suffix, normalize_suffix, and extract_query_domain. WHY the two-step: #661 created the core, wired crates/asphaleia, and added the dependency to the kernel WITHOUT importing it -- so the blocklist divergence stayed live on the side that actually filters packets, and the `*.` fail-open fix never reached it. The checker now fails on a declared *-core path dependency that no source file names, which is the tell that catches this class. NOT yet converged: parse_packet, because the kernel's PacketInfo is a deliberately narrower shape than the core's Ipv4Fields/TcpFields/UdpFields. Live port marker: firewall.rs:602."

