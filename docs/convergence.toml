[[pair]]
name = "telephony-sms"
kernel = "telephony.rs, telephony_parser.rs, sms.rs, sim.rs (CCCI/CLDMA transport, +CREG's <lac>/<ci> vs <AcT> composite shapes, and +CMTI/+COPS/+CPINR stay kernel-local; +CPIN? response classification converged, #696; SMS BCD address digit packing converged, #545)"
workspace = "klesis"
disposition = "converged"
canonical = "klesis-core (GSM-7 codec, PDU byte primitives, surveillance classification; RegStatus; SimPinState +CPIN? classifier; AT final-result/RING token exactness, +CSQ extraction, dial-string charset, and dBm/bars signal conversion)"
owner = "#545 (this PR)"
notes = "Converged (#662): the GSM-7 tables and codec, hex/BCD/cursor primitives, and the silent-SMS + WAP-Push classification. The kernel's duplicate gsm7.rs is deleted. Two live divergences were found and resolved on the way -- the kernel discarded the PID entirely, so silent SMS was detected only in the layer that never runs; and the kernel accepted GSM-7 data ending on a dangling ESC that klesis rejected. Converged (#545, this PR): RegStatus and its From<u8> table; the OK/ERROR/RING exact-token classifier and +CME ERROR:/+CMS ERROR: numeric-code extraction (#685); +CSQ rssi/ber extraction; the dial-string charset (is_valid_dial_byte, shared by klesis's outbound validate_phone_number and the kernel's inbound +CLIP validation); and the RSSI-to-dBm/dBm-to-bars signal conversion, previously kept in sync only by a comment (sim.rs carried a THIRD independent copy of the RSSI-to-dBm formula, outside this pair's named files but the same primitive -- also converged onto klesis_core rather than left as a newly-more-visible stale duplicate). One divergence found and resolved on the way: klesis's parser rejected a CME/CMS error body that was not cleanly numeric (`+CME ERROR: 10x`, or verbose AT+CMEE=2 text) outright, where the kernel already classified it as a generic error (finding 13) -- rejecting left klesis's own response loop treating the line as informational and looping for a final result that would never arrive, the same silent-timeout hazard finding 13 fixed on the kernel side. klesis now inherits the kernel's (already-tested) behavior. Converged (#696): the `+CPIN?` SIM lock-state classifier (SimPinState, parse_cpin) -- telephony_parser.rs's classifier and sim.rs's independent second classifier (parse_cpin_ready/parse_cpin_sim_pin) both matched SIM PIN/SIM PUK by prefix, so `+CPIN: SIM PUK2` (a PIN2/FDN lock, a distinct 3GPP TS 27.007 §8.3 value) took the SIM PUK arm and reported the primary-SIM PUK state; a PUK has a small lifetime attempt limit with no carrier reset, so an unlock flow built on that misclassification burns attempts against the wrong credential. Both kernel classifiers are deleted; both now delegate to klesis_core::parse_cpin, which matches by exact equality (no prefix, no shadowing order to get wrong) and adds SimPinState::Pin2Required/Puk2Required as states distinct from the primary PIN/PUK states. klesis has no `+CPIN?` response consumer of its own (CPIN_QUERY sends the command but no caller classifies the reply), so this is a one-sided convergence in the sense the `keypad-matrix-scan` pair describes -- but unlike that pair, the shared classifier is not orphaned: it has two real consumers within the kernel crate (telephony_parser.rs and sim.rs), which is what made the duplication a live defect rather than dead code. Converged (#545, this PR): sms.rs's BCD-address port marker -- klesis/src/pdu.rs carried an independent, fully re-implemented decode_bcd_address/encode_bcd_address that duplicated the digit-pair packing/unpacking klesis_core already exposed (and the kernel already consumed). klesis's decode now calls klesis_core::decode_bcd_address directly (identical behavior: '+' is prepended iff the type-of-address octet is 0x91, exactly klesis's prior rule). klesis's encode now calls a new klesis_core::pack_bcd_digits -- factored out of the already-shared klesis_core::encode_bcd_address so both the type-derived (klesis) and `+`-derived (kernel, klesis_core::encode_bcd_address) callers pack through the one implementation. Two tightenings found on the way, both fail-closed: klesis's own encode previously capped only at u8::MAX (255 digits) where klesis_core enforces the 20-digit 3GPP TS 23.040 ceiling the kernel already observed, and klesis's own decode had no digit-count cap at all; both now inherit the shared 20-digit bound (unreachable in practice -- SMS addresses never carry more digits -- but no longer a latent gap). NOT converged, by design: +CREG's composite URC shape (klesis needs `<lac>`/`<ci>`; the kernel needs `<AcT>`; the shared code table is RegStatus, already converged); +CMTI, +COPS, +CPINR, which exist on only one side; the CCCI/CLDMA hardware transport; and klesis's `Address`/`AddressType` type-of-address classification (International/National/Unknown) and its round-trip through the type-of-address octet on encode -- klesis preserves a caller-supplied type across decode/re-encode (e.g. a non-standard 0x80 'unknown' TOA it received), which the kernel has no equivalent for and which a bare `+`-prefix-driven encode (klesis_core::encode_bcd_address's own rule, used directly by the kernel) cannot reconstruct."

