# Capability reachability inventory (issue #550) — the machine-checked answer
# to "is this capability real?" Tiers:
#   compiled-only        — the Rust surface exists; nothing reachable from boot/loop
#   kernel-wired         — reachable from boot or the service loop (module-graph
#                          reachability from main/kinit/kardia), no executable witness
#   emulated-mock-proven — a named witness marker asserted in the QEMU boot log
#                          by scripts/witness/*.sh (emulation, not hardware)
#   hardware-proven      — validated on the physical AGM M7 (none today;
#                          hardware-gated entries carry hardware_reason instead)
# scripts/check-wiring-inventory.sh enforces: every main.rs module classified,
# every witness marker present in the witness scripts AND in the boot log.

[[capability]]
id = "kernel-core"
modules = ["kinit", "kinit_plan", "kardia", "exceptions", "irq", "gic", "mmu", "slab", "page", "heap", "process", "fd", "signal", "elf", "futex", "ipc", "pipe", "socket", "supervisor", "syscall", "reflex", "mmio", "memguard", "board"]
tier = "emulated-mock-proven"
witness = ["THUMOS-QEMU: boot-complete", "THUMOS-QEMU: service-loop ticks=", "/init spawned", "shell: hello from userspace", "USERFAULT:"]
notes = "PL0 isolation, graceful kill, fork/exec/brk/guard witnesses live in the per-probe scripts (kfault/sleep/fork/exec/forkexec/guard/brk/crashloop)."

[[capability]]
id = "memory-fs"
modules = ["block", "cache", "vfs", "devfs", "lfs", "lfs_imap", "lfs_segment", "lfs_checkpoint", "lfs_writer", "lfs_compact", "emmc", "ramfs"]
tier = "kernel-wired"
notes = "LFS mounts at boot (kinit Step 8d, encrypted when provisioned per #446); no witness marker asserts persistence behavior in emulation yet."

[[capability]]
id = "time"
modules = ["timer", "time", "clock"]
tier = "emulated-mock-proven"
witness = ["kardia: clock src=manual"]
notes = "ClockManager trust hierarchy wired + seeded (#402). sys_clock_gettime unification is #506; QEMU timer fidelity is #461."

[[capability]]
id = "telephony"
modules = ["telephony", "telephony_parser", "telephony_mock", "sim", "sms", "ccci", "ccci_logger"]
tier = "emulated-mock-proven"
witness = ["kardia: modem ready state=Registered", "kardia: incoming call -> ringtone", "kardia: sim iccid_len="]
notes = "Seeded mock transport; the live CCCI wire is hardware-gated. SIM PIN/PUK unlock is #517."

[[capability]]
id = "audio"
modules = ["audio", "audio_codec", "audio_route", "bt_audio", "avdtp", "sbc", "mic_audit"]
tier = "emulated-mock-proven"
witness = ["kardia: audio ready sessions=", "kardia: bt_audio sample_rate=44100 channels=2"]
notes = "NullCodec in emulation; MT6357 codec + BT HCI are hardware-gated."

[[capability]]
id = "ui"
modules = ["ui", "status_bar", "screen_home"]
tier = "emulated-mock-proven"
witness = ["kardia: splash rendered splash_px=", "kardia: frame rendered painted_px=", "kardia: nav Home -> Search", "kardia: nav Search -> Home", "kardia: statusbar net=Lte"]
notes = "Render + input dispatch + navigation through the real screen path (#400). Boot splash (#458) paints once from kinit before kardia's first frame; the mark's only call site -- never the lock screen, status bar, or a running Screen impl."

[[capability]]
id = "heorte"
modules = ["heorte", "heorte_timer", "heorte_alarm"]
tier = "emulated-mock-proven"
witness = ["kardia: heorte events="]
notes = "Calendar/alarm engine + calendar screen render wired."

[[capability]]
id = "firewall"
modules = ["firewall"]
tier = "emulated-mock-proven"
witness = ["kardia: firewall rules="]
notes = "Loop-persistent policy + verified HMAC audit chain (#403)."

[[capability]]
id = "secure-boot"
modules = ["secure_boot"]
tier = "emulated-mock-proven"
witness = ["Secure boot: DEGRADED", "image-resident initramfs signature verified"]
notes = "Fail-closed medium trust; production-signed verified boot on live eMMC is #467 (hardware-gated)."

[[capability]]
id = "security-subsystems"
modules = ["security", "security_mode", "lock_screen", "key_manager", "audit", "capability", "panic_wipe", "bfu_timer", "csprng", "secrets", "gpt"]
tier = "kernel-wired"
notes = "Security-mode manager drives the status bar (#404); encryption/key paths land with the boot-time passphrase subsystem (#446); the per-device salt + secrets preamble are #449 (this PR)."
hardware_reason = "panic wipe + tamper evidence need the physical eMMC/sensors"

[[capability]]
id = "power"
modules = ["power", "battery", "watchdog"]
tier = "kernel-wired"
hardware_reason = "PMIC/battery telemetry needs the physical device"

[[capability]]
id = "display-input"
modules = ["display", "keypad"]
tier = "kernel-wired"
notes = "Rendered via the ui capability's synthetic framebuffer in emulation; the DDP pipeline is hardware-gated. keypad (boot matrix reader, #446) is host-tested on injected matrices; the live GPIO scan is hardware-gated."

[[capability]]
id = "connectivity"
modules = ["wifi", "bluetooth", "gps", "net", "dns", "dns_tls", "dhcp"]
tier = "kernel-wired"
notes = "State machines + parsers wired; packet filter consumes them. Radio I/O is hardware-gated (fail-closed loopback in emulation)."
hardware_reason = "WiFi TX/RX/scan, BT RF, GPS NMEA need the combo chip + antennas"

[[capability]]
id = "comms-matrix"
modules = ["matrix_crypto", "http_client", "json_mini", "harmostes", "matrix_ids"]
tier = "kernel-wired"
notes = "Olm/Megolm + HTTP/JSON surfaces compiled, including the /keys/claim request/response round trip that validates and returns a peer's key (#437). consume_one_time_key -- removing one of this device's OWN keys once a peer claims it -- stays unwired: that needs a receive-side signal (a dropping device_one_time_keys_count on /sync, or an inbound Olm pre-key message) that does not exist in this tree; X3DH session establishment is also not implemented. Nothing yet drives a claim from kinit/kardia."

[[capability]]
id = "screens-extended"
modules = ["screen_search", "screen_settings", "screen_dialer", "screen_calendar", "screen_messages", "screen_fm", "screen_privacy", "screen_radio", "screen_unimplemented"]
tier = "kernel-wired"
notes = "screen_calendar renders via the heorte witness; screen_fm is fed by fm-radio's smoke witness and (#730) is now routed for BOTH input and render (previously input-only, so the FM screen took keypresses while the framebuffer kept showing Home); screen_unimplemented is the exhaustive not-implemented fallback ui.rs's screen_kind classifier routes every currently-unwired ScreenId through (matched identically by both of kardia.rs's dispatches), naming the requested screen instead of silently rendering Home (#730); search/settings/dialer/messages/privacy/radio are routed but unwitnessed. screen_privacy (#737) renders its own self-managed category list (no lfs.rs size feed yet); its purge-confirmation gate is constructed with an intentionally unsatisfiable all-zero hash because no provisioned purge/unlock passphrase reaches KernelState (see kardia.rs's KernelState::privacy field doc) -- PURGE is reachable but permanently fails closed until that credential is threaded through. screen_radio (#737) sets a DESIRED radio preset with no radio-policy manager anywhere in the kernel to apply it -- wifi.rs/gps.rs never reach KernelState even on real hardware, so the screen is genuinely self-contained, same shape as search/dialer/messages before any subsystem fed them. screen_settings also holds WifiSettingsScreen/BtSettingsScreen/AboutScreen, which -- like screen_alarm below -- are compiled but not routed; this module-level tier reflects that SettingsMenuScreen itself is genuinely wired, not that every screen type in the file is."

[[capability]]
id = "screens-compiled-only"
modules = ["screen_alarm", "screen_call", "screen_contacts", "screen_nous"]
tier = "compiled-only"
notes = "No route/input path reaches them today -- selecting their ScreenId renders the screen_unimplemented placeholder instead (#730). screen_alarm was previously (incorrectly) listed under screens-extended as 'routed but unwitnessed'; no route to it exists in kardia.rs at all, which is the drift #730 found and this entry corrects. alarm/nous/call/contacts screens wait on their owning subsystems reaching the kinit event loop (#737)."
tracking_reason = "Implemented and unit-tested, not hardware-gated -- kinit route/input wiring tracked under #737 (#145 closed without a successor, which is what #737 corrects)."

[[capability]]
id = "fm-radio"
modules = ["fm_radio"]
tier = "emulated-mock-proven"
witness = ["kardia: fm powered=true"]
notes = "FmRadio<BootFmHw> in KernelState (NullFmHw under qemu, WMT on device), powered + tuned at boot smoke, FM screen fed from it. Real MT6631 tuner backend validation is hardware-gated."

[[capability]]
id = "threat-monitor"
modules = ["screen_threat"]
tier = "emulated-mock-proven"
witness = ["kardia: threat detector_before=false", "kardia: threat detector_before=false alerts="]
notes = "ThreatMonitor in KernelState (#737): score as a lens over the log, not either alone (operator decision). The alert log is fed from the real SMS surveillance classification path (#662, ThreatAlertType::from_message_class) via a boot-smoke Silent-SMS PDU; the composite score is a log-derived heuristic (recompute_score_from_log), labelled UNCAL in the rendered UI -- NOT sema's detector engine. crates/sema (IMSI-catcher/BLE-tracker/deauth analysis) is not a thumos dependency at all -- only the shared sema-core types crate is -- so ImsiCatcher/BleTracker/DeauthAttack/CcciAnomaly/GeofenceBreach/ModemAnomaly have no producer and stay unconstructed. #555 (closed) calibrated sema's own corpus; it never wired sema into thumos, so its finding stands for this integration. #743: with no detector reporting, the screen suppresses the score entirely and renders NO DETECTOR / Monitoring unavailable rather than 'No alerts' and 0, which read as a clean result. The witness asserts detector_before=false (captured before the boot smoke seeds its classification) so the no-detector path is exercised, not merely present."

[[capability]]
id = "apps-compiled-only"
modules = ["contacts", "t9", "briar", "meshtastic", "ekphrasis", "provision", "encryption", "nous"]
tier = "compiled-only"
notes = "No production call path from boot/loop. Owners: encryption #449/#446, nous #552, ekphrasis #553, provision USB OTG (Phase 8 deferral), briar/meshtastic Phase 9 stubs."
tracking_reason = "Not hardware-gated -- encryption tracked under #449/#446, nous under #552, ekphrasis under #553. contacts and t9 have no open tracking issue for their kinit wiring; their #[expect(dead_code)] reasons still cite the closed #145, the same drift #737 corrects for the screens."

[[capability]]
id = "hardware-support"
modules = ["qemu", "console", "uart", "usb"]
tier = "kernel-wired"
notes = "console host-testability is #459; USB EP1 ISR is registered with the GIC and reader/ISR sync is locked + concurrency-tested (#666), gated on board::m7::MUSB_IRQ pending hardware confirmation of the interrupt number."

[[capability]]
id = "board-platform"
modules = ["device", "kconfig"]
tier = "kernel-wired"
notes = "Board constants consolidate under board:: in #534."

[[capability]]
id = "aletheia-bridge"
modules = ["metaxu_bridge"]
tier = "kernel-wired"
notes = "#544 on-device leg: the authenticated metaxu-core round trip over board::UART1_BASE, reachable from kinit's /metaxu_probe spawn only under the metaxu-probe feature (never in a normal boot, so no marker appears in the default boot.log this script checks). The real proof is scripts/witness/metaxu.sh's own QEMU run + metaxu.log, asserting 'metaxu: request submitted' and 'metaxu: round trip accepted' -- a witness this inventory's boot-log rule (c) does not reach because it checks a fixed boot.log path, not per-capability log files."

# Accounting rules (from the retired KERNEL-WIRING-AUDIT.md):
# - compiled+tested means the Rust surface exists; it does not imply boot,
#   userspace, or hardware readiness.
# - A capability is hardware-ready only with a production call path and
#   identity-protection behavior at the driver boundary.
