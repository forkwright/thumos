# Capability reachability inventory (issue #550) — the machine-checked answer
# to "is this capability real?" Tiers:
#   compiled-only        — the Rust surface exists; nothing reachable from boot/loop
#   kernel-wired         — reachable from boot or the service loop (module-graph
#                          reachability from main/kinit/kardia), no executable witness
#   emulated-mock-proven — a named witness marker asserted in the QEMU boot log
#                          by scripts/witness/*.sh (emulation, not hardware)
#   hardware-proven      — validated on the physical AGM M7 (none today;
#                          hardware-gated entries carry hardware_reason instead)
# scripts/check-wiring-inventory.sh enforces: every main.rs module classified,
# every witness marker present in the witness scripts AND in the boot log.

[[capability]]
id = "kernel-core"
modules = ["kinit", "kinit_plan", "kardia", "exceptions", "irq", "gic", "mmu", "slab", "page", "heap", "process", "fd", "signal", "elf", "futex", "ipc", "pipe", "socket", "supervisor", "syscall", "reflex", "mmio", "memguard", "board"]
tier = "emulated-mock-proven"
witness = ["THUMOS-QEMU: boot-complete", "THUMOS-QEMU: service-loop ticks=", "/init spawned", "shell: hello from userspace", "USERFAULT:"]
notes = "Selected PL0 image, fault, graceful-kill, fork/exec/brk, and guard-page behavior is witnessed in the per-probe scripts (kfault/sleep/fork/exec/forkexec/guard/brk/crashloop). This is not complete process isolation: #871 owns caller-VAS and direction-specific permission validation for syscall copyin/copyout, and #868 owns sys_pipe's currently unchecked output write."

[[capability]]
id = "memory-fs"
modules = ["block", "cache", "vfs", "devfs", "lfs", "lfs_imap", "lfs_segment", "lfs_checkpoint", "lfs_writer", "lfs_compact", "emmc", "ramfs", "encryption"]
tier = "kernel-wired"
notes = "LFS mounts at boot, encrypted when provisioned but still plaintext under the live Unprovisioned compatibility path (#866); no witness marker asserts persistence behavior. #360 owns the current ambiguous InvalidSuperblock auto-format/data-loss path, #867 owns the 48 KiB direct-block file ceiling, #870 owns unverified MSDC RX-count semantics, #837 owns the XTS logical-block/tweak description, and #878 owns authenticated/versioned integrity and rollback rejection beyond XTS confidentiality."

[[capability]]
id = "time"
modules = ["timer", "time", "clock"]
tier = "emulated-mock-proven"
witness = ["kardia: clock src=manual"]
notes = "The service loop drives ClockManager from the timer IRQ, and the QEMU witness seeds a manual epoch. GPS, NTP, and modem time acquisition are not exercised in emulation."

[[capability]]
id = "telephony"
modules = ["telephony", "telephony_parser", "telephony_mock", "sim", "sms", "ccci", "ccci_logger"]
tier = "emulated-mock-proven"
witness = ["kardia: modem ready state=Registered", "kardia: incoming call -> ringtone", "kardia: sim iccid_len="]
notes = "One SimManager holds one seeded mock SimInfo in emulation; PIN/PUK transitions are host-tested. The non-test CcciModemTransport still hard-fails every operation, so #398 owns the software CCCI-to-AT bridge before any modem witness. Two-slot state/routing is tracked by #858."

[[capability]]
id = "audio"
modules = ["audio", "audio_codec", "audio_route", "bt_audio", "avdtp", "sbc", "mic_audit"]
tier = "emulated-mock-proven"
witness = ["kardia: audio ready sessions=", "kardia: bt_audio sample_rate=44100 channels=2"]
notes = "QEMU witnesses AudioManager/RouteManager with NullCodec plus A2DP configuration. MicAuditLog is only manually paired with the smoke, not coupled to every audio transition (#399). A2DP still emits zero-audio through StubSbcEncoder (#401), and the live Bluetooth backend remains #129 software work. The non-QEMU MT6357 path fails closed with PmicUnavailable and performs no PMIC/AP MMIO; #862 owns the source-grounded PWRAP seam. The modem/call-audio route and AEC criterion lack source/calibration (#876); both precede hardware qualification."

[[capability]]
id = "ui"
modules = ["ui", "status_bar", "screen_home"]
tier = "emulated-mock-proven"
witness = ["kardia: splash rendered splash_px=", "kardia: frame rendered painted_px=", "kardia: nav Home -> Search", "kardia: nav Search -> Home", "kardia: statusbar net=Lte"]
notes = "Render + input dispatch + navigation through the real screen path (#400). Boot splash (#458) paints once from kinit before kardia's first frame; the mark's only call site -- never the lock screen, status bar, or a running Screen impl."

[[capability]]
id = "heorte"
modules = ["heorte", "heorte_timer", "heorte_alarm"]
tier = "emulated-mock-proven"
witness = ["kardia: heorte events="]
notes = "Calendar/alarm engine + calendar screen render wired."

[[capability]]
id = "firewall"
modules = ["firewall"]
tier = "emulated-mock-proven"
witness = ["kardia: firewall rules="]
notes = "Loop-persistent firewall policy is witnessed. Its audit sink uses a volatile per-boot CSPRNG key; the retained live HMAC chain has no persistent rollback/truncation anchor. #863 owns durable audit integration."

[[capability]]
id = "post-entry-image-verification"
modules = ["secure_boot"]
tier = "emulated-mock-proven"
witness = ["Secure boot: DEGRADED", "image-resident initramfs signature verified"]
notes = "The in-kernel Ed25519 checks gate later behavior only if the already executing kernel honors them; they are not measured boot and cannot authenticate that kernel. #467 first owns deterministic Android boot-image/scatter packaging plus a pre-entry verification chain. Only after that software path lands can an operator-owned live-eMMC production-signature witness run."

[[capability]]
id = "security-subsystems"
modules = ["security", "security_mode", "lock_screen", "key_manager", "audit", "capability", "panic_wipe", "csprng", "secrets", "gpt"]
tier = "kernel-wired"
notes = "Boot passphrase, salt/preamble, key hierarchy, security modes, and the dry-run/key-zeroization panic path are reachable. #840 owns the timer estimator that can credit deterministic increments as entropy; #872 owns the offline-resistant boot-secret/KDF policy; #873 owns non-repeating CSPRNG wake/reboot reseeding; #841 owns the weak latent lock-screen verifier; #863 owns persisted wipe/distress/reflex/audit-head work; #878 owns authenticated/versioned persistent-data rollback resistance; #881 owns physical side-button/PTT producers and safe gestures. None is discharged by eMMC or sensor qualification."

[[capability]]
id = "bfu-timer"
modules = ["bfu_timer"]
tier = "compiled-only"
notes = "BfuTimer is host-tested, but its only boot construction is commented out and the service loop never ticks it."
tracking_reason = "Production timeout/action integration is software work tracked by #863."

[[capability]]
id = "power-policy"
modules = ["power"]
tier = "kernel-wired"
notes = "PowerManager policy state is boot/service-loop reachable, but radio state changes are in-memory requests only. A modem-cut request records a sticky marker without PMIC/AP MMIO; #862 owns source-grounded actuation and readback. #874 owns requested/applied/observed/failed semantics and removal of the uncalibrated automatic request. CPU performance/core policy is a host-test-only candidate; runtime DVFS/MCDI requests and actuation are absent, with #879 still owning source-grounded policy, transaction, readback, and qualification. All three are software STOPs before hardware."

[[capability]]
id = "watchdog"
modules = ["watchdog"]
tier = "kernel-wired"
notes = "The MT6739 watchdog path is boot-reachable, but the timer IRQ currently pets it before scheduler/service-loop progress; #875 owns progress-coupled liveness so a deadlocked kernel is not kept alive."
hardware_reason = "After #875 lands, an operator-owned physical reset/deadline receipt is still required."

[[capability]]
id = "battery-monitor"
modules = ["battery"]
tier = "compiled-only"
notes = "BatteryMonitor and its generic conversion/polling policy are host-tested, but no production kinit or service-loop path constructs or polls it. #877 owns a source-grounded PMIC interface and versioned state-of-charge model with explicit uncertainty."
tracking_reason = "Software model plus boot/service integration (#877 and #753) precede PMIC telemetry qualification."

[[capability]]
id = "display-input"
modules = ["display", "keypad"]
tier = "kernel-wired"
notes = "Rendered via the UI capability's synthetic framebuffer in emulation. #854 must resolve and source-ground the DBI/DSI GC9306 transport before a panel receipt. The boot keypad matrix is host-tested on injected rows, but #880 owns the placeholder AGM M7 pins, generic GPIO transaction model, and fail-closed device adapter before any keypad receipt; #753 then owns non-QEMU service-loop delivery."

[[capability]]
id = "connectivity"
modules = ["net", "dns", "dhcp"]
tier = "kernel-wired"
notes = "The kernel/service-loop network, DHCP, and plain-DNS surfaces are wired; live packet I/O still depends on the separate radio-driver capability. #864 owns WPA3-SAE, AF_INET6, and listen/accept software paths omitted by the closed historical owner."

[[capability]]
id = "dns-tls"
modules = ["dns_tls"]
tier = "compiled-only"
notes = "DotClient framing, pinning, and transport logic are host-tested, but every construction site is test-only and no production resolver/network path drives it."
tracking_reason = "Software service-loop/resolver integration is tracked by #753 before live transport qualification."

[[capability]]
id = "radio-drivers"
modules = ["wifi", "bluetooth", "gps"]
tier = "kernel-wired"
notes = "kinit constructs and readiness-checks the non-test WiFi, Bluetooth, and GPS adapters, so they are boot-reachable. Their production backends are still software stubs: WiFi rejects TX/scan/association, Bluetooth rejects command/ACL TX and returns no RX, and GPS returns no RX and rejects power-on. #129 owns those WMT/STP paths before operator-owned M7 RF qualification."

[[capability]]
id = "comms-matrix"
modules = ["matrix_crypto", "http_client", "json_mini", "harmostes", "matrix_ids"]
tier = "compiled-only"
notes = "HTTP/JSON plus this kernel's simplified, non-interoperable Olm/Megolm surfaces are compiled and host-tested. The inbound to-device pre-key path consumes a local one-time key and establishes an OlmSession, but MatrixClient is never constructed from kernel_main, so no production boot/service-loop path reaches it. Per-message Olm ratchet advancement remains absent (#844)."
tracking_reason = "Unified-inbox and MatrixClient integration is software work tracked by #753."

[[capability]]
id = "screens-extended"
modules = ["screen_search", "screen_settings", "screen_dialer", "screen_calendar", "screen_messages", "screen_fm", "screen_privacy", "screen_radio", "screen_unimplemented"]
tier = "kernel-wired"
notes = "screen_calendar renders via the heorte witness; screen_fm is fed by fm-radio's smoke witness and (#730) is routed for input and render; screen_unimplemented is the exhaustive fallback for currently unwired ScreenIds. Search/settings/dialer/messages/privacy/radio are routed but unwitnessed. screen_privacy's purge gate is unprovisioned (`purge_code: None`) and refuses every confirmation until a provisioned verifier reaches KernelState. screen_radio stores only a desired preset: no manager applies or observes it, and #874 owns requested/applied/observed/failed UI semantics. screen_settings also contains WifiSettingsScreen/BtSettingsScreen/AboutScreen that are compiled but not routed; the module tier does not promote every contained screen."

[[capability]]
id = "screens-compiled-only"
modules = ["screen_alarm", "screen_call", "screen_contacts", "screen_nous"]
tier = "compiled-only"
notes = "No route/input path reaches them today -- selecting their ScreenId renders the screen_unimplemented placeholder instead (#730). screen_alarm was previously (incorrectly) listed under screens-extended as 'routed but unwitnessed'; no route to it exists in kardia.rs at all, which is the drift #730 found and this entry corrects. alarm/nous/call/contacts screens wait on their owning subsystems reaching the service loop (#753)."
tracking_reason = "Implemented and unit-tested, not hardware-gated; service-loop route/input integration is tracked by #753."

[[capability]]
id = "fm-radio"
modules = ["fm_radio"]
tier = "emulated-mock-proven"
witness = ["kardia: fm powered=true"]
notes = "FmRadio<BootFmHw> in KernelState uses NullFmHw under QEMU and is powered/tuned in the boot smoke. The non-test backend still fabricates power/tune success and lacks seek/RSSI, so #129 owns software implementation before MT6631 qualification."

[[capability]]
id = "threat-monitor"
modules = ["screen_threat"]
tier = "emulated-mock-proven"
witness = ["kardia: threat detector_before=false", "kardia: threat detector_before=false alerts="]
notes = "ThreatMonitor is reached and the boot smoke feeds the SMS surveillance classification path, but the composite score is a log-derived UNCAL heuristic, not sema's detector engine; only sema-core types are linked and the other detector producers remain absent. With no detector report, #743 suppresses the score and renders NO DETECTOR. The modem status input is CCCI boot-path availability, not rail state; #874 owns that requested/applied/observed distinction and forbids automatic radio-cut action from an uncalibrated score."

[[capability]]
id = "apps-compiled-only"
modules = ["contacts", "t9", "briar", "meshtastic", "ekphrasis", "provision", "nous"]
tier = "compiled-only"
notes = "No production call path from boot/service loop. Provisioning additionally embeds a public RFC 8032 test trust anchor; #869 owns production key injection, test-key rejection, identity/freshness/replay semantics, and custody before reachability. Briar and Meshtastic remain Phase-09 surfaces."
tracking_reason = "Software reachability is tracked by #753; provisioning trust is separately blocked by #869."

[[capability]]
id = "hardware-support"
modules = ["qemu", "console", "uart", "usb"]
tier = "kernel-wired"
notes = "USB controller base 0x1120_0000 is source-resolved. The EP1 ISR, GIC dispatch, and reader/ISR synchronization are host-tested, but board::m7::MUSB_IRQ remains None; #676 owns source adjudication and any physical witness. UART RX-ready semantics/presence timing remain source-first under #865."

[[capability]]
id = "board-platform"
modules = ["device", "kconfig"]
tier = "kernel-wired"
notes = "Board constants consolidate under board:: in #534."

[[capability]]
id = "aletheia-bridge"
modules = ["metaxu_bridge"]
tier = "kernel-wired"
notes = "#544 on-device leg: the authenticated metaxu-core round trip over board::UART1_BASE, reachable from kinit's /metaxu_probe spawn only under the metaxu-probe feature (never in a normal boot, so no marker appears in the default boot.log this script checks). The real proof is scripts/witness/metaxu.sh's own QEMU run + metaxu.log, asserting 'metaxu: request submitted' and 'metaxu: round trip accepted' -- a witness this inventory's boot-log rule (c) does not reach because it checks a fixed boot.log path, not per-capability log files."

# Accounting rules retained from the retired hand-maintained audit (#550):
# - compiled+tested means the Rust surface exists; it does not imply boot,
#   embedded-program, service-loop, or hardware readiness.
# - A capability is hardware-ready only with a production call path and
#   identity-protection behavior at the driver boundary.
