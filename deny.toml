[graph]
all-features = true

[advisories]
ignore = [
    # WHY: transitive dep via heapless 0.7 (postcard) -- no upgrade path available
    "RUSTSEC-2023-0089",
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0",
    "OpenSSL", "0BSD", "AGPL-3.0-only",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
